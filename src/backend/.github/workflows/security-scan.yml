  # =============================================================================
  # CONTAINER SECURITY SCANNING JOB
  # =============================================================================
  # Comprehensive Docker container security analysis using Trivy scanner with
  # vulnerability assessment, configuration analysis, and educational reporting
  container-security-scanning:
    name: 🐳 Container Security Assessment
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: [security-environment-setup]
    if: needs.security-environment-setup.outputs.container-scan-enabled == 'true'
    
    # Docker-in-Docker service for container building and scanning
    services:
      docker:
        image: docker:24-dind
        options: --privileged
        
    steps:
      # Repository checkout for Docker container analysis
      - name: 📥 Checkout Repository for Container Security Analysis
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      # Docker environment setup for container security scanning
      - name: 🐳 Setup Docker Environment for Container Analysis
        run: |
          echo "🔒 Setting up Docker environment for comprehensive container security scanning"
          
          # Verify Docker daemon availability
          docker --version
          docker info
          
          # Configure Docker for security scanning
          echo '{"experimental": true}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          
          echo "✅ Docker environment configured for security scanning"

      # Install Trivy container security scanner for comprehensive analysis
      - name: 🔧 Install Trivy Container Security Scanner
        run: |
          echo "🔒 Installing Trivy container security scanner for comprehensive analysis"
          
          # Install Trivy using official installation script
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.48.3
          
          # Verify Trivy installation
          trivy --version
          
          # Update Trivy vulnerability database
          trivy image --download-db-only
          
          echo "✅ Trivy container security scanner installed and updated"

      # Build Docker image for comprehensive security analysis
      - name: 🏗️ Build Docker Image for Security Analysis
        working-directory: src/backend
        run: |
          echo "🔒 Building Docker image for comprehensive container security analysis"
          
          # Build Docker image with security-focused build arguments
          docker build \
            --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --build-arg VCS_REF="${{ github.sha }}" \
            --tag ${{ env.DOCKER_IMAGE_NAME }}:security-scan \
            --tag ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} \
            --file Dockerfile \
            .
          
          # Verify image creation
          docker images ${{ env.DOCKER_IMAGE_NAME }}
          
          echo "✅ Docker image built successfully for security analysis"

      # Execute comprehensive Trivy container vulnerability scanning
      - name: 🔍 Execute Trivy Container Vulnerability Scanning
        run: |
          echo "🔒 Executing comprehensive Trivy container vulnerability scanning"
          
          # Create container scan output directory
          mkdir -p ${{ env.SCAN_OUTPUT_DIR }}/container-scan
          
          # Execute comprehensive Trivy container scan with multiple formats
          echo "📊 Running Trivy container vulnerability analysis"
          
          # JSON format scan for programmatic analysis
          trivy image \
            --format json \
            --output ${{ env.SCAN_OUTPUT_DIR }}/container-scan/trivy-container-results.json \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            ${{ env.DOCKER_IMAGE_NAME }}:security-scan
          
          # SARIF format scan for GitHub Security integration
          trivy image \
            --format sarif \
            --output ${{ env.SCAN_OUTPUT_DIR }}/container-scan/trivy-container.sarif \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            ${{ env.DOCKER_IMAGE_NAME }}:security-scan
          
          # Human-readable format for analysis and reporting
          trivy image \
            --format table \
            --output ${{ env.SCAN_OUTPUT_DIR }}/container-scan/trivy-container-report.txt \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            ${{ env.DOCKER_IMAGE_NAME }}:security-scan
          
          # Extract vulnerability summary for analysis
          if [[ -f "${{ env.SCAN_OUTPUT_DIR }}/container-scan/trivy-container-results.json" ]]; then
            echo "📈 Extracting container vulnerability metrics"
            
            # Count vulnerabilities by severity
            CRITICAL_VULNS=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' ${{ env.SCAN_OUTPUT_DIR }}/container-scan/trivy-container-results.json)
            HIGH_VULNS=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' ${{ env.SCAN_OUTPUT_DIR }}/container-scan/trivy-container-results.json)
            MEDIUM_VULNS=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "MEDIUM")] | length' ${{ env.SCAN_OUTPUT_DIR }}/container-scan/trivy-container-results.json)
            LOW_VULNS=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "LOW")] | length' ${{ env.SCAN_OUTPUT_DIR }}/container-scan/trivy-container-results.json)
            
            echo "🔒 Container Vulnerability Summary:"
            echo "   Critical: ${CRITICAL_VULNS}"
            echo "   High: ${HIGH_VULNS}"
            echo "   Medium: ${MEDIUM_VULNS}"
            echo "   Low: ${LOW_VULNS}"
            
            # Create container vulnerability summary
            cat > ${{ env.SCAN_OUTPUT_DIR }}/container-scan/container-vulnerability-summary.json << EOF
          {
            "scan_type": "trivy_container",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "image": "${{ env.DOCKER_IMAGE_NAME }}:security-scan",
            "vulnerabilities": {
              "critical": ${CRITICAL_VULNS},
              "high": ${HIGH_VULNS},
              "medium": ${MEDIUM_VULNS},
              "low": ${LOW_VULNS}
            },
            "total_vulnerabilities": $((CRITICAL_VULNS + HIGH_VULNS + MEDIUM_VULNS + LOW_VULNS))
          }
          EOF
            
            echo "✅ Container vulnerability analysis completed successfully"
          else
            echo "⚠️ Trivy container results not generated - creating empty summary"
            echo '{"scan_type": "trivy_container", "vulnerabilities": {"critical": 0, "high": 0, "medium": 0, "low": 0}, "total_vulnerabilities": 0}' > ${{ env.SCAN_OUTPUT_DIR }}/container-scan/container-vulnerability-summary.json
          fi

      # Execute Dockerfile security configuration analysis
      - name: 🔍 Execute Dockerfile Security Configuration Analysis
        run: |
          echo "🔒 Executing Dockerfile security configuration analysis"
          
          # Analyze Dockerfile for security best practices and configuration issues
          echo "📊 Running Trivy configuration analysis on Dockerfile"
          
          # Configuration scan of Dockerfile
          trivy config \
            --format json \
            --output ${{ env.SCAN_OUTPUT_DIR }}/container-scan/dockerfile-config-results.json \
            --exit-code 0 \
            src/backend/Dockerfile
          
          # Human-readable Dockerfile configuration report
