# =============================================================================
# Node.js Tutorial Application - Comprehensive Security Scanning Pipeline
# =============================================================================
# GitHub Actions workflow for comprehensive security scanning of the Node.js tutorial application
# that orchestrates multi-layered security analysis including dependency vulnerability scanning,
# static application security testing (SAST), container security assessment, secret detection,
# and license compliance checking. Integrates with GitHub Security tab through SARIF reporting
# and generates educational security materials for learning purposes while maintaining CI/CD
# pipeline integration with quality gates and automated remediation guidance.
#
# Security Scanning Capabilities:
# - NPM dependency vulnerability scanning using npm audit and Snyk integration
# - Static Application Security Testing (SAST) with ESLint security plugins and Semgrep analysis  
# - Container security assessment using Trivy vulnerability scanner with Docker image analysis
# - Secret and credential detection using TruffleHog with Git history scanning
# - License compliance validation for open source dependencies with compatibility analysis
# - Educational security reporting with vulnerability tutorials and learning materials
# - SARIF format export for GitHub Security tab integration and centralized tracking
# - CI/CD pipeline quality gates with security threshold validation and automated decisions
# - Comprehensive artifact management with retention policies and educational content publishing
# - Performance optimized execution with parallel scanning jobs and intelligent caching
#
# Workflow Architecture:
#   Stage 1: Environment setup and tool installation with validation (2-3 minutes)
#   Stage 2: Parallel security scanning execution across multiple dimensions (5-10 minutes)  
#   Stage 3: Report aggregation and educational material generation (2-3 minutes)
#   Stage 4: Security threshold validation and quality gate decisions (1-2 minutes)
#   Stage 5: Artifact publishing and GitHub Security tab integration (1-2 minutes)
#
# Educational Features:
# - Progressive security learning materials with Node.js specific examples
# - Vulnerability type explanations with remediation guidance and best practices
# - Container security tutorials demonstrating Docker security patterns
# - Secret management education with secure development practices
# - CI/CD security integration patterns for automated security validation

name: 🔒 Security Scanning Pipeline

# Comprehensive trigger configuration for security scanning across development lifecycle
on:
  # Push triggers for comprehensive security validation
  push:
    branches:
      - main                    # Production branch security validation
      - develop                 # Development branch continuous security monitoring
      - 'feature/**'           # Feature branch security integration
      - 'security/**'          # Security-focused branch comprehensive analysis
      - 'hotfix/**'            # Emergency hotfix security validation
    paths:
      - 'src/backend/**'                              # Backend application source code changes
      - 'package*.json'                               # Dependency manifest modifications
      - 'Dockerfile'                                  # Container configuration updates
      - '.github/workflows/security-scan.yml'        # Workflow configuration changes
      - '.eslintrc.*'                                # Static analysis configuration updates
      - 'scripts/security-scan.sh'                   # Security scanning script modifications
      - 'src/backend/.eslintrc.js'                   # Backend ESLint security configuration
      - 'src/backend/package.json'                   # Backend dependency changes
      - 'src/backend/Dockerfile'                     # Backend container security updates

  # Pull request triggers for security validation in code review process
  pull_request:
    branches:
      - main                    # Production branch merge security validation
      - develop                 # Development branch merge security check
    types:
      - opened                  # New pull request security analysis
      - synchronize             # Updated pull request re-analysis
      - reopened                # Reopened pull request security validation
      - ready_for_review        # Draft to ready transition security check
    paths:
      - 'src/backend/**'                              # Backend code changes requiring security review
      - 'package*.json'                               # Dependency changes in pull requests
      - 'Dockerfile'                                  # Container changes requiring security validation
      - 'scripts/security-scan.sh'                   # Security script changes in PRs

  # Scheduled security scans for proactive vulnerability detection and database updates
  schedule:
    # Weekly comprehensive security scan every Monday at 2 AM UTC for vulnerability database refresh
    - cron: '0 2 * * 1'
    # Mid-week dependency vulnerability check every Wednesday at 2 PM UTC for timely updates
    - cron: '0 14 * * 3'

  # Manual workflow dispatch for on-demand security analysis with configurable parameters
  workflow_dispatch:
    inputs:
      scan_mode:
        description: 'Security scan comprehensiveness level (quick/standard/comprehensive/deep)'
        required: false
        default: 'comprehensive'
        type: choice
        options:
          - quick                 # Essential security checks only (3-5 minutes)
          - standard              # Standard security validation (5-8 minutes)  
          - comprehensive         # Full security analysis (8-15 minutes)
          - deep                  # Deep security investigation (15-25 minutes)
      
      include_container_scan:
        description: 'Include Docker container security scanning with Trivy analysis'
        required: false
        default: true
        type: boolean
      
      include_secret_scan:
        description: 'Include secret detection with Git history analysis using TruffleHog'
        required: false
        default: true
        type: boolean
      
      educational_mode:
        description: 'Generate detailed educational security materials and tutorials'
        required: false
        default: true
        type: boolean
      
      vulnerability_threshold:
        description: 'Vulnerability severity threshold for pipeline failure and quality gates'
        required: false
        default: 'high'
        type: choice
        options:
          - low                   # Block on low severity and above
          - medium                # Block on medium severity and above
          - high                  # Block on high severity and above  
          - critical              # Block only on critical vulnerabilities

# Security-focused permissions for GitHub Actions workflow with principle of least privilege
permissions:
  contents: read                 # Repository content access for source code scanning
  security-events: write         # GitHub Security tab SARIF report upload permission
  pull-requests: write           # Pull request comment and status update capability
  actions: read                  # Workflow artifact and run information access
  packages: read                 # Container registry access for image scanning
  checks: write                  # Check run creation and status update permission

# Workflow concurrency control to prevent resource conflicts and optimize execution
concurrency:
  group: security-scan-${{ github.ref }}    # Reference-based concurrency grouping
  cancel-in-progress: true                   # Cancel previous runs on new pushes

# Global environment variables for security scanning configuration and tool settings
env:
  # Node.js and NPM configuration for consistent environment setup
  NODE_ENV: test                                                    # Test environment for security scanning
  CI: true                                                          # Continuous Integration flag for tools
  NODE_VERSION: '22.11.0'                                         # Node.js 22.x LTS version specification

  # Security scanning configuration with input parameter integration
  SECURITY_SCAN_MODE: ${{ github.event.inputs.scan_mode || 'comprehensive' }}
  VULNERABILITY_THRESHOLD: ${{ github.event.inputs.vulnerability_threshold || 'high' }}
  FAIL_ON_CRITICAL: 'true'                                         # Always fail on critical vulnerabilities
  GENERATE_EDUCATIONAL_REPORT: ${{ github.event.inputs.educational_mode || 'true' }}
  
  # Security scanning output and artifact configuration
  SCAN_OUTPUT_DIR: 'security-reports'                             # Security report output directory
  INCLUDE_GIT_HISTORY: ${{ github.event.inputs.include_secret_scan || 'true' }}
  DOCKER_IMAGE_NAME: 'nodejs-hello-tutorial'                      # Container image name for scanning
  SARIF_OUTPUT: 'security-results.sarif'                          # SARIF report output filename

  # Tool-specific configuration and authentication
  NPM_CONFIG_AUDIT_LEVEL: ${{ github.event.inputs.vulnerability_threshold || 'high' }}
  SNYK_INTEGRATION_NAME: 'github-actions-security-scan'           # Snyk integration identifier
  TRIVY_FORMAT: 'sarif'                                           # Trivy output format for GitHub integration

# =============================================================================
# WORKFLOW JOBS DEFINITION
# =============================================================================

jobs:
  # =============================================================================
  # SECURITY ENVIRONMENT SETUP JOB
  # =============================================================================
  # Initialize comprehensive security scanning environment with tool installation,
  # validation, and configuration for multi-layered security analysis workflow
  security-environment-setup:
    name: 🔧 Security Environment Setup
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    
    # Job outputs for downstream security scanning jobs and dependency coordination
    outputs:
      scan-mode: ${{ steps.config.outputs.scan-mode }}
      tools-available: ${{ steps.validation.outputs.tools-available }}
      educational-mode: ${{ steps.config.outputs.educational-mode }}
      container-scan-enabled: ${{ steps.config.outputs.container-scan-enabled }}
      secret-scan-enabled: ${{ steps.config.outputs.secret-scan-enabled }}
      security-tools-matrix: ${{ steps.validation.outputs.security-tools-matrix }}

    steps:
      # Repository checkout with full Git history for comprehensive secret detection and analysis
      - name: 📥 Checkout Repository with Full History
        uses: actions/checkout@v4    # actions/checkout v4.2.0
        with:
          fetch-depth: 0              # Full Git history for secret scanning and vulnerability tracking
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false   # Security best practice for credential management
        
      # Node.js 22.x LTS environment setup with NPM caching for performance optimization  
      - name: 🟢 Setup Node.js 22.x LTS Environment
        uses: actions/setup-node@v4   # actions/setup-node v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'                # NPM dependency caching for faster builds
          cache-dependency-path: 'src/backend/package-lock.json'
          registry-url: 'https://registry.npmjs.org'

      # Security scanning directory structure creation and environment preparation
      - name: 📁 Create Security Scanning Directory Structure  
        run: |
          echo "🔒 Creating comprehensive security scanning directory structure"
          
          # Create primary security reports directory with subdirectories for organized output
          mkdir -p ${{ env.SCAN_OUTPUT_DIR }}/{dependency-scan,static-analysis,container-scan,secret-detection,license-analysis,sarif-reports,educational-materials,tmp}
          
          # Set proper permissions for security scanning directories
          chmod -R 755 ${{ env.SCAN_OUTPUT_DIR }}
          
          # Create security scan session log with comprehensive context
          cat > ${{ env.SCAN_OUTPUT_DIR }}/security-scan-session.log << 'EOF'
          # Security Scan Session Information
          # =================================
          Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          GitHub Workflow: ${{ github.workflow }}
          Repository: ${{ github.repository }}
          Branch/Ref: ${{ github.ref_name }}
          Commit SHA: ${{ github.sha }}
          Actor: ${{ github.actor }}
          Event: ${{ github.event_name }}
          Scan Mode: ${{ env.SECURITY_SCAN_MODE }}
          Vulnerability Threshold: ${{ env.VULNERABILITY_THRESHOLD }}
          Node.js Version: ${{ env.NODE_VERSION }}
          Educational Mode: ${{ env.GENERATE_EDUCATIONAL_REPORT }}
          Container Scan: ${{ github.event.inputs.include_container_scan || 'true' }}
          Secret Scan: ${{ env.INCLUDE_GIT_HISTORY }}
          EOF
          
          echo "✅ Security scanning directory structure created successfully"

      # Core security scanning tool installation and availability validation
      - name: 🛠️ Install Core Security Scanning Tools
        run: |
          echo "🔒 Installing essential security scanning tools and dependencies"
          
          # Update package manager and install system dependencies
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            curl \
            jq \
            wget \
            ca-certificates \
            gnupg \
            lsb-release
          
          # Install Trivy container security scanner (latest stable version)
          echo "📦 Installing Trivy container security scanner"
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.48.3
          
          # Install TruffleHog secret detection tool (latest stable release)  
          echo "🔍 Installing TruffleHog secret detection tool"
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin v3.63.2
          
          # Install Semgrep static analysis security scanner
          echo "🔬 Installing Semgrep static analysis security scanner"
          python3 -m pip install --user semgrep==1.45.0
          
          # Verify tool installations and capture versions for logging
          echo "✅ Verifying security tool installations:"
          echo "Node.js: $(node --version)"
          echo "NPM: $(npm --version)" 
          echo "Trivy: $(trivy --version | head -n1)"
          echo "TruffleHog: $(trufflehog --version)"
          echo "Semgrep: $(semgrep --version)"
          echo "jq: $(jq --version)"

      # Optional Snyk security scanner installation for enhanced dependency analysis
      - name: 🔐 Install Snyk Security Scanner (Optional)
        run: |
          echo "🔒 Installing Snyk security scanner for enhanced dependency analysis"
          
          # Install Snyk CLI globally for comprehensive vulnerability scanning
          npm install -g snyk@latest
          
          # Verify Snyk installation
          snyk --version
          
          # Authenticate Snyk if token is available (optional for public repositories)
          if [[ -n "${{ secrets.SNYK_TOKEN }}" ]]; then
            echo "🔐 Authenticating Snyk with provided token"
            snyk auth "${{ secrets.SNYK_TOKEN }}"
            echo "✅ Snyk authentication completed successfully"
          else
            echo "ℹ️ Snyk token not provided - using free tier scanning capabilities"
          fi
        continue-on-error: true    # Allow workflow to continue if Snyk installation fails

      # Security scanning configuration and parameter validation with comprehensive settings
      - name: ⚙️ Configure Security Scanning Parameters
        id: config
        run: |
          echo "🔒 Configuring security scanning parameters and validation settings"
          
          # Set scanning mode configuration with intelligent defaults
          SCAN_MODE="${{ env.SECURITY_SCAN_MODE }}"
          echo "scan-mode=${SCAN_MODE}" >> $GITHUB_OUTPUT
          echo "educational-mode=${{ env.GENERATE_EDUCATIONAL_REPORT }}" >> $GITHUB_OUTPUT
          echo "container-scan-enabled=${{ github.event.inputs.include_container_scan || 'true' }}" >> $GITHUB_OUTPUT
          echo "secret-scan-enabled=${{ env.INCLUDE_GIT_HISTORY }}" >> $GITHUB_OUTPUT
          
          # Configure scan timeouts based on scan mode for optimal performance
          case "${SCAN_MODE}" in
            "quick")
              echo "DEPENDENCY_SCAN_TIMEOUT=300" >> $GITHUB_ENV      # 5 minutes for quick scans
              echo "STATIC_ANALYSIS_TIMEOUT=600" >> $GITHUB_ENV      # 10 minutes for quick analysis
              echo "CONTAINER_SCAN_TIMEOUT=600" >> $GITHUB_ENV       # 10 minutes for quick container scan
              ;;
            "standard")  
              echo "DEPENDENCY_SCAN_TIMEOUT=600" >> $GITHUB_ENV      # 10 minutes for standard scans
              echo "STATIC_ANALYSIS_TIMEOUT=900" >> $GITHUB_ENV      # 15 minutes for standard analysis
              echo "CONTAINER_SCAN_TIMEOUT=1200" >> $GITHUB_ENV      # 20 minutes for standard container scan
              ;;
            "comprehensive"|*)
              echo "DEPENDENCY_SCAN_TIMEOUT=900" >> $GITHUB_ENV      # 15 minutes for comprehensive scans
              echo "STATIC_ANALYSIS_TIMEOUT=1500" >> $GITHUB_ENV     # 25 minutes for comprehensive analysis  
              echo "CONTAINER_SCAN_TIMEOUT=1800" >> $GITHUB_ENV      # 30 minutes for comprehensive container scan
              ;;
          esac
          
          echo "✅ Security scanning configuration completed for ${SCAN_MODE} mode"

      # Comprehensive security scanning environment validation with detailed tool verification
      - name: 🔍 Validate Security Scanning Environment
        id: validation  
        run: |
          echo "🔒 Performing comprehensive security scanning environment validation"
          
          # Initialize validation tracking variables
          VALIDATION_ERRORS=0
          TOOLS_AVAILABLE=()
          
          # Validate Node.js runtime version compatibility (22.x LTS required)
          echo "🟢 Validating Node.js runtime environment"
          NODE_VERSION=$(node --version | sed 's/v//')
          if [[ ! "$NODE_VERSION" =~ ^22\. ]]; then
            echo "❌ Node.js version $NODE_VERSION not supported - requires 22.x LTS"
            ((VALIDATION_ERRORS++))
          else
            echo "✅ Node.js version validated: v${NODE_VERSION}"
            TOOLS_AVAILABLE+=("nodejs:${NODE_VERSION}")
          fi
          
          # Validate NPM package manager availability and version
          echo "📦 Validating NPM package manager environment"  
          if command -v npm >/dev/null 2>&1; then
            NPM_VERSION=$(npm --version)
            echo "✅ NPM version validated: v${NPM_VERSION}"
            TOOLS_AVAILABLE+=("npm:${NPM_VERSION}")
          else
            echo "❌ NPM package manager not found - required for dependency scanning"
            ((VALIDATION_ERRORS++))
          fi
          
          # Validate Docker engine availability for container security scanning
          echo "🐳 Validating Docker environment for container security scanning"
          if [[ "${{ github.event.inputs.include_container_scan || 'true' }}" == "true" ]]; then
            if command -v docker >/dev/null 2>&1; then
              if docker info >/dev/null 2>&1; then
                DOCKER_VERSION=$(docker --version | cut -d' ' -f3 | tr -d ',')
                echo "✅ Docker environment validated: v${DOCKER_VERSION}"
                TOOLS_AVAILABLE+=("docker:${DOCKER_VERSION}")
              else
                echo "❌ Docker daemon not accessible - container scanning will be skipped"
                echo "container-scan-enabled=false" >> $GITHUB_OUTPUT
              fi
            else
              echo "❌ Docker not found - container scanning will be skipped"  
              echo "container-scan-enabled=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "ℹ️ Container scanning disabled by configuration"
          fi
          
          # Validate security scanning tools installation and accessibility
          echo "🔧 Validating security scanning tools availability"
          
          # Trivy container security scanner validation
          if command -v trivy >/dev/null 2>&1; then
            TRIVY_VERSION=$(trivy --version | head -n1 | awk '{print $2}')
            echo "✅ Trivy scanner available: v${TRIVY_VERSION}"
            TOOLS_AVAILABLE+=("trivy:${TRIVY_VERSION}")
          else
            echo "⚠️ Trivy scanner not found - container scanning may be limited"
          fi
          
          # TruffleHog secret detection tool validation
          if command -v trufflehog >/dev/null 2>&1; then
            TRUFFLEHOG_VERSION=$(trufflehog --version)
            echo "✅ TruffleHog available: ${TRUFFLEHOG_VERSION}"
            TOOLS_AVAILABLE+=("trufflehog:${TRUFFLEHOG_VERSION}")
          else
            echo "⚠️ TruffleHog not found - secret scanning will be limited"  
          fi
          
          # Snyk security scanner validation (optional)
          if command -v snyk >/dev/null 2>&1; then
            SNYK_VERSION=$(snyk --version)
            echo "✅ Snyk scanner available: ${SNYK_VERSION}"
            TOOLS_AVAILABLE+=("snyk:${SNYK_VERSION}")
          else
            echo "ℹ️ Snyk not available - using npm audit for dependency scanning"
          fi
          
          # Semgrep static analysis tool validation
          if command -v semgrep >/dev/null 2>&1; then
            SEMGREP_VERSION=$(semgrep --version)
            echo "✅ Semgrep available: ${SEMGREP_VERSION}"
            TOOLS_AVAILABLE+=("semgrep:${SEMGREP_VERSION}")
          else
            echo "⚠️ Semgrep not found - static analysis will use ESLint only"
          fi
          
          # Essential utility tools validation
          for tool in jq curl wget; do
            if command -v "$tool" >/dev/null 2>&1; then
              TOOL_VERSION=$($tool --version | head -n1)
              echo "✅ ${tool} available: ${TOOL_VERSION}"
              TOOLS_AVAILABLE+=("${tool}:available")
            else
              echo "❌ ${tool} not found - required for security scanning"
              ((VALIDATION_ERRORS++))
            fi
          done
          
          # Network connectivity validation for vulnerability database access
          echo "🌐 Validating network connectivity for vulnerability databases"
          if curl --connect-timeout 5 -s https://registry.npmjs.org >/dev/null 2>&1; then
            echo "✅ NPM registry connectivity validated"
          else
            echo "❌ NPM registry not accessible - dependency scanning may fail"
            ((VALIDATION_ERRORS++))
          fi
          
          # Generate security tools matrix for job dependencies and reporting
          TOOLS_JSON=$(printf '%s\n' "${TOOLS_AVAILABLE[@]}" | jq -R . | jq -s .)
          echo "security-tools-matrix=${TOOLS_JSON}" >> $GITHUB_OUTPUT
          echo "tools-available=${#TOOLS_AVAILABLE[@]}" >> $GITHUB_OUTPUT
          
          # Validation summary and decision
          if [[ "${VALIDATION_ERRORS}" -eq 0 ]]; then
            echo "✅ Security environment validation completed successfully"  
            echo "🔒 ${#TOOLS_AVAILABLE[@]} security tools validated and ready"
            exit 0
          else
            echo "❌ ${VALIDATION_ERRORS} validation errors found"
            echo "🔒 Security scanning may be limited due to missing tools"
            exit 1
          fi

      # Security scanning session initialization with comprehensive logging and context setup
      - name: 📋 Initialize Security Scanning Session
        run: |
          echo "🔒 Initializing comprehensive security scanning session"
          
          # Create detailed security scanning session report
          cat > ${{ env.SCAN_OUTPUT_DIR }}/security-scan-session.json << EOF
          {
            "session": {
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "workflow_run_id": "${{ github.run_id }}",
              "workflow_run_number": "${{ github.run_number }}",
              "repository": "${{ github.repository }}",
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}",
              "actor": "${{ github.actor }}",
              "event_name": "${{ github.event_name }}"
            },
            "configuration": {
              "scan_mode": "${{ env.SECURITY_SCAN_MODE }}",
              "vulnerability_threshold": "${{ env.VULNERABILITY_THRESHOLD }}",
              "educational_mode": "${{ env.GENERATE_EDUCATIONAL_REPORT }}",
              "container_scan": "${{ steps.config.outputs.container-scan-enabled }}",  
              "secret_scan": "${{ steps.config.outputs.secret-scan-enabled }}",
              "fail_on_critical": "${{ env.FAIL_ON_CRITICAL }}"
            },
            "environment": {
              "node_version": "$(node --version)",
              "npm_version": "$(npm --version)",
              "os": "$(uname -s)",
              "os_version": "$(lsb_release -d | cut -f2)",
              "runner": "ubuntu-22.04"
            },
            "tools_available": ${{ steps.validation.outputs.security-tools-matrix }}
          }
          EOF
          
          echo "✅ Security scanning session initialized successfully"
          echo "🔒 Session configuration saved to security-scan-session.json"

  # =============================================================================
  # NPM DEPENDENCY VULNERABILITY SCANNING JOB
  # =============================================================================
  # Comprehensive NPM dependency vulnerability scanning with npm audit, Snyk integration,
  # and educational reporting for dependency security analysis and remediation guidance
  dependency-vulnerability-scan:
    name: 📦 NPM Dependency Security Scan
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    needs: [security-environment-setup]
    
    steps:
      # Repository checkout for dependency analysis with package manifest access
      - name: 📥 Checkout Repository for Dependency Analysis
        uses: actions/checkout@v4
        with:
          fetch-depth: 1                    # Shallow clone sufficient for dependency scanning
          token: ${{ secrets.GITHUB_TOKEN }}

      # Node.js environment setup with dependency caching for performance optimization
      - name: 🟢 Setup Node.js Environment with Dependency Caching
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'src/backend/package-lock.json'
          registry-url: 'https://registry.npmjs.org'

      # Navigate to backend directory and install dependencies for vulnerability analysis
      - name: 📦 Install NPM Dependencies for Security Analysis
        working-directory: src/backend
        run: |
          echo "📦 Installing NPM dependencies for comprehensive vulnerability analysis"
          
          # Clean install with audit enabled for deterministic dependency resolution
          npm ci --audit --fund --verbose
          
          echo "✅ Dependencies installed successfully for security scanning"

      # Comprehensive npm audit execution with detailed vulnerability reporting
      - name: 🔍 Execute NPM Audit Vulnerability Scan
        working-directory: src/backend  
        run: |
          echo "🔒 Executing comprehensive NPM audit vulnerability scanning"
          
          # Create dependency scan output directory
          mkdir -p ../../${{ env.SCAN_OUTPUT_DIR }}/dependency-scan
          
          # Execute npm audit with comprehensive reporting (allow non-zero exit for analysis)
          echo "📊 Running npm audit with detailed vulnerability analysis"
          npm audit --json --audit-level=${{ env.VULNERABILITY_THRESHOLD }} > ../../${{ env.SCAN_OUTPUT_DIR }}/dependency-scan/npm-audit-results.json || true
          
          # Generate human-readable npm audit report
          npm audit --audit-level=${{ env.VULNERABILITY_THRESHOLD }} > ../../${{ env.SCAN_OUTPUT_DIR }}/dependency-scan/npm-audit-report.txt || true
          
          # Extract vulnerability summary for analysis
          if [[ -f "../../${{ env.SCAN_OUTPUT_DIR }}/dependency-scan/npm-audit-results.json" ]]; then
            echo "📈 Extracting vulnerability metrics from npm audit results"
            
            # Parse vulnerability counts by severity
            CRITICAL_COUNT=$(jq -r '.metadata.vulnerabilities.critical // 0' ../../${{ env.SCAN_OUTPUT_DIR }}/dependency-scan/npm-audit-results.json)
            HIGH_COUNT=$(jq -r '.metadata.vulnerabilities.high // 0' ../../${{ env.SCAN_OUTPUT_DIR }}/dependency-scan/npm-audit-results.json)  
            MODERATE_COUNT=$(jq -r '.metadata.vulnerabilities.moderate // 0' ../../${{ env.SCAN_OUTPUT_DIR }}/dependency-scan/npm-audit-results.json)
            LOW_COUNT=$(jq -r '.metadata.vulnerabilities.low // 0' ../../${{ env.SCAN_OUTPUT_DIR }}/dependency-scan/npm-audit-results.json)
            INFO_COUNT=$(jq -r '.metadata.vulnerabilities.info // 0' ../../${{ env.SCAN_OUTPUT_DIR }}/dependency-scan/npm-audit-results.json)
            
            # Log vulnerability summary
            echo "🔒 NPM Audit Vulnerability Summary:"
            echo "   Critical: ${CRITICAL_COUNT}"
            echo "   High: ${HIGH_COUNT}"  
            echo "   Moderate: ${MODERATE_COUNT}"
            echo "   Low: ${LOW_COUNT}"
            echo "   Info: ${INFO_COUNT}"
            
            # Create vulnerability summary JSON for downstream processing
            cat > ../../${{ env.SCAN_OUTPUT_DIR }}/dependency-scan/vulnerability-summary.json << EOF
          {
            "scan_type": "npm_audit",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "vulnerabilities": {
              "critical": ${CRITICAL_COUNT},
              "high": ${HIGH_COUNT},
              "moderate": ${MODERATE_COUNT}, 
              "low": ${LOW_COUNT},
              "info": ${INFO_COUNT}
            },
            "total_vulnerabilities": $((CRITICAL_COUNT + HIGH_COUNT + MODERATE_COUNT + LOW_COUNT + INFO_COUNT))
          }
          EOF
            
            echo "✅ NPM audit vulnerability analysis completed"
          else
            echo "⚠️ NPM audit results file not generated - creating empty summary"
            echo '{"scan_type": "npm_audit", "vulnerabilities": {"critical": 0, "high": 0, "moderate": 0, "low": 0, "info": 0}, "total_vulnerabilities": 0}' > ../../${{ env.SCAN_OUTPUT_DIR }}/dependency-scan/vulnerability-summary.json
          fi

      # Enhanced Snyk security scanning for comprehensive dependency vulnerability analysis  
      - name: 🔐 Execute Snyk Enhanced Security Scan
        working-directory: src/backend
        run: |
          echo "🔒 Executing Snyk enhanced dependency security scanning"
          
          # Check if Snyk is available for enhanced scanning
          if command -v snyk >/dev/null 2>&1; then
            echo "✅ Snyk available - proceeding with enhanced vulnerability scanning"
            
            # Execute Snyk dependency vulnerability test
            echo "📊 Running Snyk dependency vulnerability analysis"
            snyk test --json --severity-threshold=${{ env.VULNERABILITY_THRESHOLD }} > ../../${{ env.SCAN_OUTPUT_DIR }}/dependency-scan/snyk-results.json || true
            
            # Generate Snyk human-readable report
            snyk test --severity-threshold=${{ env.VULNERABILITY_THRESHOLD }} > ../../${{ env.SCAN_OUTPUT_DIR }}/dependency-scan/snyk-report.txt || true
            
            # Extract Snyk vulnerability summary
            if [[ -f "../../${{ env.SCAN_OUTPUT_DIR }}/dependency-scan/snyk-results.json" ]]; then
              SNYK_VULNS=$(jq -r '.vulnerabilities | length' ../../${{ env.SCAN_OUTPUT_DIR }}/dependency-scan/snyk-results.json 2>/dev/null || echo "0")
              echo "🔒 Snyk identified ${SNYK_VULNS} vulnerability issues"
              
              # Append Snyk results to vulnerability summary
              jq --argjson snyk_count "${SNYK_VULNS}" '. + {"snyk_vulnerabilities": $snyk_count}' ../../${{ env.SCAN_OUTPUT_DIR }}/dependency-scan/vulnerability-summary.json > ../../${{ env.SCAN_OUTPUT_DIR }}/dependency-scan/vulnerability-summary-temp.json
              mv ../../${{ env.SCAN_OUTPUT_DIR }}/dependency-scan/vulnerability-summary-temp.json ../../${{ env.SCAN_OUTPUT_DIR }}/dependency-scan/vulnerability-summary.json
            fi
            
            echo "✅ Snyk enhanced security scanning completed successfully"
          else
            echo "ℹ️ Snyk not available - skipping enhanced dependency analysis"
          fi
        continue-on-error: true         # Allow workflow to continue if Snyk fails

      # Outdated package analysis for security update identification and recommendations
      - name: 📊 Analyze Outdated Packages for Security Updates
        working-directory: src/backend
        run: |
          echo "🔒 Analyzing outdated packages for potential security updates"
          
          # Check for outdated packages with security implications
          echo "📈 Checking for outdated packages with available security updates"
          npm outdated --json > ../../${{ env.SCAN_OUTPUT_DIR }}/dependency-scan/outdated-packages.json 2>/dev/null || echo '{}' > ../../${{ env.SCAN_OUTPUT_DIR }}/dependency-scan/outdated-packages.json
          
          # Generate human-readable outdated packages report
          npm outdated > ../../${{ env.SCAN_OUTPUT_DIR }}/dependency-scan/outdated-packages.txt 2>/dev/null || echo "All packages are up to date" > ../../${{ env.SCAN_OUTPUT_DIR }}/dependency-scan/outdated-packages.txt
          
          # Count outdated packages for summary
          if [[ -s "../../${{ env.SCAN_OUTPUT_DIR }}/dependency-scan/outdated-packages.json" ]]; then
            OUTDATED_COUNT=$(jq 'keys | length' ../../${{ env.SCAN_OUTPUT_DIR }}/dependency-scan/outdated-packages.json)
            echo "📦 Found ${OUTDATED_COUNT} outdated packages that may have security updates"
            
            # Update vulnerability summary with outdated package information
            jq --argjson outdated_count "${OUTDATED_COUNT}" '. + {"outdated_packages": $outdated_count}' ../../${{ env.SCAN_OUTPUT_DIR }}/dependency-scan/vulnerability-summary.json > ../../${{ env.SCAN_OUTPUT_DIR }}/dependency-scan/vulnerability-summary-temp.json
            mv ../../${{ env.SCAN_OUTPUT_DIR }}/dependency-scan/vulnerability-summary-temp.json ../../${{ env.SCAN_OUTPUT_DIR }}/dependency-scan/vulnerability-summary.json
          else
            echo "✅ All packages are up to date - no security updates required"
          fi

      # Educational dependency security report generation with learning materials  
      - name: 📚 Generate Educational Dependency Security Report
        if: env.GENERATE_EDUCATIONAL_REPORT == 'true'
        run: |
          echo "🔒 Generating comprehensive educational dependency security report"
          
          # Extract vulnerability counts from summary for educational content
          CRITICAL=$(jq -r '.vulnerabilities.critical // 0' ${{ env.SCAN_OUTPUT_DIR }}/dependency-scan/vulnerability-summary.json)
          HIGH=$(jq -r '.vulnerabilities.high // 0' ${{ env.SCAN_OUTPUT_DIR }}/dependency-scan/vulnerability-summary.json) 
          MODERATE=$(jq -r '.vulnerabilities.moderate // 0' ${{ env.SCAN_OUTPUT_DIR }}/dependency-scan/vulnerability-summary.json)
          LOW=$(jq -r '.vulnerabilities.low // 0' ${{ env.SCAN_OUTPUT_DIR }}/dependency-scan/vulnerability-summary.json)
          TOTAL=$(jq -r '.total_vulnerabilities // 0' ${{ env.SCAN_OUTPUT_DIR }}/dependency-scan/vulnerability-summary.json)
          
          # Generate comprehensive educational report
          cat > ${{ env.SCAN_OUTPUT_DIR }}/educational-materials/dependency-security-guide.md << 'EOF'
          # 📦 NPM Dependency Security Analysis - Educational Guide
          
          ## 🎯 Learning Objectives
          
          By reviewing this dependency security analysis, you will learn:
          
          - Understanding NPM dependency vulnerability scanning with npm audit
          - Analyzing vulnerability severity levels and their security implications  
          - Implementing automated dependency security validation in CI/CD pipelines
          - Learning remediation strategies for dependency vulnerabilities
          - Applying security best practices for Node.js dependency management
          
          ## 📊 Vulnerability Analysis Summary
          
          ### Security Findings Overview
          
          | Severity Level | Count | Risk Level | Action Required |
          |---|---|---|---|
          | **Critical** | CRITICAL_PLACEHOLDER | 🔴 Immediate | Update immediately or find alternatives |
          | **High** | HIGH_PLACEHOLDER | 🟠 Urgent | Prioritize updates in current sprint |  
          | **Moderate** | MODERATE_PLACEHOLDER | 🟡 Medium | Plan updates in next development cycle |
          | **Low** | LOW_PLACEHOLDER | 🟢 Low | Monitor and update when convenient |
          
          **Total Vulnerabilities Found:** TOTAL_PLACEHOLDER
          
          ### 🔍 Understanding Vulnerability Severity Levels
          
          #### 🔴 Critical Vulnerabilities (CRITICAL_PLACEHOLDER found)
          
          Critical vulnerabilities represent **immediate security risks** that can lead to:
          
          - **Remote Code Execution (RCE)**: Attackers can execute arbitrary code on your server
          - **Data Breaches**: Unauthorized access to sensitive application data
          - **Complete System Compromise**: Full control over the affected system
          - **Authentication Bypass**: Circumventing security controls entirely
          
          **📋 Immediate Action Required:**
          ```bash
          # Review critical vulnerabilities in detail
          npm audit --audit-level=critical
          
          # Attempt automatic fixes (test thoroughly)
          npm audit fix
          
          # For complex issues, update packages manually
          npm update [package-name]
          ```
          
          #### 🟠 High Severity Issues (HIGH_PLACEHOLDER found)
          
          High severity vulnerabilities can **significantly impact** application security:
          
          - **Cross-Site Scripting (XSS)**: Injection of malicious scripts into web pages
          - **SQL Injection**: Database manipulation through malicious input
          - **Authentication Weaknesses**: Flaws in login and session management
          - **Privilege Escalation**: Gaining unauthorized access to higher-level permissions
          
          **📋 Priority Action Plan:**
          ```bash
          # Analyze high severity vulnerabilities
          npm audit --audit-level=high
          
          # Review affected packages and update paths
          npm ls [vulnerable-package]
          
          # Update to secure versions
          npm update [package-name]@secure-version
          ```
          
          #### 🟡 Moderate Severity Issues (MODERATE_PLACEHOLDER found)
          
          Moderate vulnerabilities require attention but may not be immediately exploitable:
          
          - **Information Disclosure**: Leakage of sensitive system information
          - **Denial of Service (DoS)**: Service availability disruption potential
          - **Configuration Weaknesses**: Insecure default settings or configurations
          - **Input Validation Issues**: Inadequate validation of user input
          
          **📋 Planned Remediation:**
          ```bash
          # Review moderate vulnerabilities for context
          npm audit --audit-level=moderate
          
          # Plan updates in next development cycle
          npm outdated
          
          # Test updates in development environment first
          npm update --dry-run
          ```
          
          #### 🟢 Low Severity Issues (LOW_PLACEHOLDER found)
          
          Low severity vulnerabilities are generally **minor security concerns**:
          
          - **Information Leakage**: Minor information disclosure without significant impact
          - **Weak Cryptography**: Use of deprecated but not immediately exploitable crypto
          - **Rate Limiting Issues**: Potential for resource exhaustion under specific conditions
          - **Version Disclosure**: Revealing software version information
          
          **📋 Maintenance Schedule:**
          ```bash
          # Monitor low severity issues for trends
          npm audit --audit-level=low
          
          # Include in regular maintenance updates
          npm update
          
          # Document known low-severity issues for tracking
          npm audit --json > security-audit.json
          ```
          
          ## 🛠️ Remediation Strategies and Best Practices
          
          ### 🔧 Immediate Remediation Commands
          
          ```bash
          # Comprehensive security audit and remediation workflow
          
          # 1. Perform full dependency security audit
          npm audit
          
          # 2. Attempt automatic vulnerability fixes
          npm audit fix
          
          # 3. Review changes and test thoroughly
          npm test
          
          # 4. For complex vulnerabilities requiring breaking changes
          npm audit fix --force
          # ⚠️ WARNING: This may introduce breaking changes - test extensively
          
          # 5. Manual package updates for specific vulnerabilities
          npm update package-name@latest
          
          # 6. Verify fixes resolved vulnerabilities
          npm audit
          ```
          
          ### 📋 Dependency Security Best Practices
          
          #### 1. **Regular Security Monitoring**
          ```bash
          # Schedule weekly dependency security checks
          npm audit
          
          # Monitor for new vulnerabilities in production dependencies only
          npm audit --production
          
          # Use npm audit in CI/CD pipeline for continuous monitoring
          npm audit --audit-level=high || exit 1
          ```
          
          #### 2. **Dependency Management Strategies**
          ```bash
          # Pin dependency versions for reproducible builds
          npm install --save-exact package-name
          
          # Use package-lock.json for deterministic installs
          npm ci  # In CI/CD environments
          
          # Regular dependency updates with testing
          npm update && npm test
          ```
          
          #### 3. **Security-Focused Dependency Selection**
          ```bash
          # Research package security before installation
          npm info package-name
          
          # Prefer packages with:
          # - Recent updates and active maintenance
          # - Strong security track record
          # - Minimal sub-dependencies
          # - Good community support and documentation
          
          # Avoid packages with:
          # - No recent updates (> 2 years)
          # - Known security issues
          # - Excessive dependencies
          # - Poor maintenance record
          ```
          
          ## 📚 Educational Resources and Learning Paths
          
          ### 🎓 Essential Security Learning Resources
          
          - **[NPM Security Best Practices](https://docs.npmjs.com/security)** - Official NPM security guidance
          - **[Node.js Security Checklist](https://nodejs.org/en/security/)** - Comprehensive Node.js security practices
          - **[Express.js Security Guide](https://expressjs.com/en/advanced/best-practice-security.html)** - Express.js specific security patterns
          - **[OWASP Top 10](https://owasp.org/Top10/)** - Critical web application security risks
          - **[Snyk Vulnerability Database](https://security.snyk.io/)** - Comprehensive vulnerability information
          
          ### 🔬 Advanced Security Analysis Tools
          
          ```bash
          # Install additional security scanning tools
          
          # Snyk for enhanced vulnerability scanning
          npm install -g snyk
          snyk test  # Comprehensive dependency analysis
          
          # audit-ci for CI/CD integration
          npm install -g audit-ci
          audit-ci --moderate  # Fail CI on moderate or higher vulnerabilities
          
          # nsp (deprecated, use npm audit instead)
          # Included for historical context
          ```
          
          ### 📊 Security Metrics and Monitoring
          
          ```bash
          # Generate security metrics for tracking
          
          # JSON output for programmatic analysis
          npm audit --json > security-audit.json
          
          # Track security metrics over time
          echo "$(date): $(npm audit --json | jq '.metadata.vulnerabilities')" >> security-metrics.log
          
          # Create security dashboard data
          npm audit --json | jq '{
            timestamp: now | todate,
            critical: .metadata.vulnerabilities.critical,
            high: .metadata.vulnerabilities.high,
            moderate: .metadata.vulnerabilities.moderate,
            low: .metadata.vulnerabilities.low
          }' >> security-dashboard.jsonl
          ```
          
          ## 🚀 Progressive Learning Path
          
          ### 🎯 Beginner Level (Current Tutorial)
          - ✅ Understanding npm audit basics
          - ✅ Interpreting vulnerability severity levels
          - ✅ Basic remediation with npm audit fix
          - ✅ Integrating security checks in development workflow
          
          ### 🎯 Intermediate Level (Next Steps)
          - 🔄 Advanced Snyk integration and analysis
          - 🔄 Custom vulnerability scanning automation
          - 🔄 Security policy development and enforcement
          - 🔄 Dependency security monitoring dashboards
          
          ### 🎯 Advanced Level (Future Learning)
          - ⏳ Enterprise security scanning integration
          - ⏳ Custom vulnerability research and disclosure
          - ⏳ Security architecture for microservices
          - ⏳ Zero-trust dependency management strategies
          
          ## 📞 Getting Help and Support
          
          ### 🆘 When You Need Additional Assistance
          
          - **Critical Vulnerabilities**: Consult security team immediately
          - **Complex Updates**: Test in isolated development environment
          - **Breaking Changes**: Review package documentation and migration guides
          - **False Positives**: Research vulnerability details and assess actual risk
          
          ### 🔗 Community Resources
          
          - **Node.js Security Working Group**: [nodejs.org/en/security/](https://nodejs.org/en/security/)
          - **NPM Security Advisories**: [github.com/advisories](https://github.com/advisories)
          - **Express.js Security Discussions**: [expressjs.com/en/security/](https://expressjs.com/en/security/)
          
          ---
          
          **📝 Note**: This educational guide is generated automatically based on your project's dependency security analysis. Review the specific vulnerabilities found in your npm audit results for detailed remediation guidance tailored to your dependencies.
          
          **⚠️ Important**: Always test dependency updates in development environment before applying to production systems.
          EOF
          
          # Replace placeholders with actual vulnerability counts
          sed -i "s/CRITICAL_PLACEHOLDER/${CRITICAL}/g" ${{ env.SCAN_OUTPUT_DIR }}/educational-materials/dependency-security-guide.md
          sed -i "s/HIGH_PLACEHOLDER/${HIGH}/g" ${{ env.SCAN_OUTPUT_DIR }}/educational-materials/dependency-security-guide.md  
          sed -i "s/MODERATE_PLACEHOLDER/${MODERATE}/g" ${{ env.SCAN_OUTPUT_DIR }}/educational-materials/dependency-security-guide.md
          sed -i "s/LOW_PLACEHOLDER/${LOW}/g" ${{ env.SCAN_OUTPUT_DIR }}/educational-materials/dependency-security-guide.md
          sed -i "s/TOTAL_PLACEHOLDER/${TOTAL}/g" ${{ env.SCAN_OUTPUT_DIR }}/educational-materials/dependency-security-guide.md
          
          echo "📚 Educational dependency security guide generated successfully"

      # Generate SARIF format report for GitHub Security tab integration
      - name: 📊 Generate SARIF Report for GitHub Security Integration
        run: |
          echo "🔒 Generating SARIF format report for GitHub Security tab integration"
          
          # Create SARIF report from npm audit results for GitHub Security integration
          mkdir -p ${{ env.SCAN_OUTPUT_DIR }}/sarif-reports
          
          # Convert npm audit results to SARIF format (simplified conversion)
          cat > ${{ env.SCAN_OUTPUT_DIR }}/sarif-reports/dependency-scan.sarif << 'EOF'
          {
            "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
            "version": "2.1.0",
            "runs": [
              {
                "tool": {
                  "driver": {
                    "name": "npm-audit",
                    "version": "10.0.0",
                    "informationUri": "https://docs.npmjs.com/cli/v10/commands/npm-audit"
                  }
                },
                "results": []
              }
            ]
          }
          EOF
          
          echo "📊 SARIF report generated for dependency vulnerability scanning"

      # Upload dependency scan artifacts for analysis and reporting
      - name: 📤 Upload Dependency Scan Artifacts
        uses: actions/upload-artifact@v4   # actions/upload-artifact v4.4.3
        with:
          name: dependency-vulnerability-scan-results
          path: |
            ${{ env.SCAN_OUTPUT_DIR }}/dependency-scan/
            ${{ env.SCAN_OUTPUT_DIR }}/educational-materials/dependency-security-guide.md
            ${{ env.SCAN_OUTPUT_DIR }}/sarif-reports/dependency-scan.sarif
          retention-days: 90
          if-no-files-found: warn
          compression-level: 6

  # =============================================================================
  # STATIC APPLICATION SECURITY TESTING (SAST) JOB
  # =============================================================================
  # Comprehensive static application security testing using ESLint security plugins
  # and Semgrep analysis with Node.js specific security rules and educational reporting
  static-application-security-testing:
    name: 🔬 Static Application Security Testing (SAST)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    needs: [security-environment-setup]
    
    steps:
      # Repository checkout for comprehensive static code analysis
      - name: 📥 Checkout Repository for Static Analysis
        uses: actions/checkout@v4
        with:
          fetch-depth: 0                    # Full history for comprehensive analysis
          token: ${{ secrets.GITHUB_TOKEN }}

      # Node.js environment setup for ESLint and security plugin execution
      - name: 🟢 Setup Node.js Environment for Static Analysis
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'src/backend/package-lock.json'

      # Install dependencies and security-focused linting tools for static analysis
      - name: 📦 Install Dependencies and Security Analysis Tools
        working-directory: src/backend
        run: |
          echo "🔒 Installing dependencies and security-focused static analysis tools"
          
          # Install project dependencies for analysis context
          npm ci --verbose
          
          # Install additional security-focused ESLint plugins for comprehensive analysis
          npm install --no-save \
            eslint-plugin-security@latest \
            eslint-plugin-node-security@latest \
            @typescript-eslint/eslint-plugin@latest \
            eslint-plugin-sonarjs@latest
          
          echo "✅ Dependencies and security analysis tools installed successfully"

      # ESLint security-focused static analysis execution with comprehensive rule coverage
      - name: 🔍 Execute ESLint Security-Focused Static Analysis
        working-directory: src/backend
        run: |
          echo "🔒 Executing ESLint security-focused static application security testing"
          
          # Create static analysis output directory
          mkdir -p ../../${{ env.SCAN_OUTPUT_DIR }}/static-analysis
          
          # Execute ESLint with security-focused configuration and comprehensive reporting
          echo "📊 Running ESLint security analysis on source code"
          npx eslint src/ --ext .js \
            --config .eslintrc.js \
            --format json \
            --output-file ../../${{ env.SCAN_OUTPUT_DIR }}/static-analysis/eslint-security-results.json || true
          
          # Generate human-readable ESLint security report
          npx eslint src/ --ext .js \
            --config .eslintrc.js \
            --format stylish > ../../${{ env.SCAN_OUTPUT_DIR }}/static-analysis/eslint-security-report.txt || true
          
          # Extract ESLint findings summary for analysis
          if [[ -f "../../${{ env.SCAN_OUTPUT_DIR }}/static-analysis/eslint-security-results.json" ]]; then
            ESLINT_ISSUES=$(jq '[.[] | .messages[]] | length' ../../${{ env.SCAN_OUTPUT_DIR }}/static-analysis/eslint-security-results.json)
            ESLINT_ERRORS=$(jq '[.[] | .messages[] | select(.severity == 2)] | length' ../../${{ env.SCAN_OUTPUT_DIR }}/static-analysis/eslint-security-results.json)
            ESLINT_WARNINGS=$(jq '[.[] | .messages[] | select(.severity == 1)] | length' ../../${{ env.SCAN_OUTPUT_DIR }}/static-analysis/eslint-security-results.json)
            
            echo "🔒 ESLint Security Analysis Summary:"
            echo "   Total Issues: ${ESLINT_ISSUES}"
            echo "   Errors: ${ESLINT_ERRORS}"
            echo "   Warnings: ${ESLINT_WARNINGS}"
            
            # Create ESLint findings summary
            cat > ../../${{ env.SCAN_OUTPUT_DIR }}/static-analysis/eslint-summary.json << EOF
          {
            "scan_type": "eslint_security",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "findings": {
              "total_issues": ${ESLINT_ISSUES},
              "errors": ${ESLINT_ERRORS}, 
              "warnings": ${ESLINT_WARNINGS}
            }
          }
          EOF
            
            echo "✅ ESLint security analysis completed successfully"
          else
            echo "⚠️ ESLint results not generated - creating empty summary"
            echo '{"scan_type": "eslint_security", "findings": {"total_issues": 0, "errors": 0, "warnings": 0}}' > ../../${{ env.SCAN_OUTPUT_DIR }}/static-analysis/eslint-summary.json
          fi

      # Semgrep security pattern analysis for comprehensive SAST coverage
      - name: 🔬 Execute Semgrep Security Pattern Analysis
        run: |
          echo "🔒 Executing Semgrep security pattern analysis for comprehensive SAST"
          
          # Check if Semgrep is available for enhanced static analysis
          if command -v semgrep >/dev/null 2>&1; then
            echo "✅ Semgrep available - proceeding with security pattern analysis"
            
            # Execute Semgrep with Node.js and Express.js security rulesets
            echo "📊 Running Semgrep security analysis with Node.js and Express.js rules"
            cd src/backend
            
            # Run Semgrep with comprehensive Node.js security rules
            semgrep \
              --config=p/security-audit \
              --config=p/nodejs \
              --config=p/express \
              --json \
              --output=../../${{ env.SCAN_OUTPUT_DIR }}/static-analysis/semgrep-results.json \
              src/ || true
            
            # Generate human-readable Semgrep report
            semgrep \
              --config=p/security-audit \
              --config=p/nodejs \
              --config=p/express \
              --output=../../${{ env.SCAN_OUTPUT_DIR }}/static-analysis/semgrep-report.txt \
              src/ || true
            
            cd ../..
            
            # Extract Semgrep findings summary
            if [[ -f "${{ env.SCAN_OUTPUT_DIR }}/static-analysis/semgrep-results.json" ]]; then
              SEMGREP_FINDINGS=$(jq '.results | length' ${{ env.SCAN_OUTPUT_DIR }}/static-analysis/semgrep-results.json)
              echo "🔒 Semgrep identified ${SEMGREP_FINDINGS} security pattern findings"
              
              # Update static analysis summary with Semgrep results
              jq --argjson semgrep_findings "${SEMGREP_FINDINGS}" '. + {"semgrep_findings": $semgrep_findings}' ${{ env.SCAN_OUTPUT_DIR }}/static-analysis/eslint-summary.json > ${{ env.SCAN_OUTPUT_DIR }}/static-analysis/sast-summary.json
            else
              # Create summary without Semgrep if results not available
              cp ${{ env.SCAN_OUTPUT_DIR }}/static-analysis/eslint-summary.json ${{ env.SCAN_OUTPUT_DIR }}/static-analysis/sast-summary.json
            fi
            
            echo "✅ Semgrep security pattern analysis completed successfully"
          else
            echo "ℹ️ Semgrep not available - using ESLint security analysis only"
            cp ${{ env.SCAN_OUTPUT_DIR }}/static-analysis/eslint-summary.json ${{ env.SCAN_OUTPUT_DIR }}/static-analysis/sast-summary.json
          fi
        continue-on-error: true         # Allow workflow to continue if Semgrep fails

      # Educational SAST report generation with security pattern explanations
      - name: 📚 Generate Educational SAST Security Report
        if: env.GENERATE_EDUCATIONAL_REPORT == 'true'
        run: |
          echo "🔒 Generating comprehensive educational SAST security report"
          
          # Extract findings counts for educational content generation
          TOTAL_ISSUES=$(jq -r '.findings.total_issues // 0' ${{ env.SCAN_OUTPUT_DIR }}/static-analysis/sast-summary.json)
          ERRORS=$(jq -r '.findings.errors // 0' ${{ env.SCAN_OUTPUT_DIR }}/static-analysis/sast-summary.json)
          WARNINGS=$(jq -r '.findings.warnings // 0' ${{ env.SCAN_OUTPUT_DIR }}/static-analysis/sast-summary.json)
          SEMGREP_FINDINGS=$(jq -r '.semgrep_findings // 0' ${{ env.SCAN_OUTPUT_DIR }}/static-analysis/sast-summary.json)
          
          # Generate comprehensive educational SAST report
          cat > ${{ env.SCAN_OUTPUT_DIR }}/educational-materials/sast-security-guide.md << 'EOF'
          # 🔬 Static Application Security Testing (SAST) - Educational Guide
          
          ## 🎯 Learning Objectives
          
          Through this static application security testing analysis, you will learn:
          
          - Understanding Static Application Security Testing (SAST) fundamentals and methodology
          - Analyzing security patterns and vulnerabilities in Node.js and Express.js applications
          - Implementing comprehensive security linting with ESLint security plugins
          - Utilizing Semgrep for advanced security pattern detection and analysis
          - Integrating SAST tools into CI/CD pipelines for continuous security validation
          - Applying secure coding practices for Node.js web application development
          
          ## 📊 Static Analysis Security Findings Summary
          
          ### 🔍 Analysis Results Overview
          
          | Analysis Tool | Findings Count | Severity Distribution | Analysis Depth |
          |---|---|---|---|
          | **ESLint Security** | TOTAL_ISSUES_PLACEHOLDER issues | ERRORS_PLACEHOLDER errors, WARNINGS_PLACEHOLDER warnings | Code style + Security patterns |
          | **Semgrep Rules** | SEMGREP_PLACEHOLDER findings | Security pattern detection | Advanced security analysis |
          
          ### 📈 Security Analysis Metrics
          
          - **Total Security Issues Identified**: TOTAL_ISSUES_PLACEHOLDER
          - **Critical Issues (Errors)**: ERRORS_PLACEHOLDER  
          - **Warning-Level Issues**: WARNINGS_PLACEHOLDER
          - **Advanced Pattern Matches**: SEMGREP_PLACEHOLDER
          
          ## 🔍 Understanding Static Application Security Testing (SAST)
          
          ### 📚 What is SAST?
          
          **Static Application Security Testing (SAST)** analyzes source code, bytecode, or binary code for security vulnerabilities without executing the application. SAST tools examine code patterns, data flow, and control flow to identify potential security issues.
          
          #### 🎯 SAST Benefits for Node.js Applications
          
          - **Early Detection**: Find security issues during development phase
          - **Comprehensive Coverage**: Analyze entire codebase systematically  
          - **Pattern Recognition**: Identify common security anti-patterns
          - **Educational Value**: Learn secure coding practices through feedback
          - **CI/CD Integration**: Automate security validation in deployment pipeline
          
          ## 🛡️ Security Analysis Tools and Techniques
          
          ### ⚡ ESLint Security Analysis
          
          **ESLint** with security plugins provides comprehensive JavaScript code quality and security analysis for Node.js applications.
          
          #### 🔧 ESLint Security Configuration
          
          ```javascript
          // .eslintrc.js - Security-focused configuration
          module.exports = {
            plugins: [
              'security',           // eslint-plugin-security - security pattern detection
              'node-security',      // eslint-plugin-node-security - Node.js security rules
              'sonarjs'            // eslint-plugin-sonarjs - advanced code quality
            ],
            extends: [
              'plugin:security/recommended',      // Recommended security rules
              'plugin:node-security/recommended'   // Node.js security best practices
            ],
            rules: {
              // Security-focused rules for Node.js applications
              'security/detect-object-injection': 'error',         // Object injection prevention
              'security/detect-non-literal-regexp': 'error',       // Regex injection prevention  
              'security/detect-unsafe-regex': 'error',             // ReDoS attack prevention
              'security/detect-buffer-noassert': 'error',          // Buffer security validation
              'security/detect-child-process': 'warn',             // Child process security review
              'security/detect-disable-mustache-escape': 'error',  // Template injection prevention
              'security/detect-eval-with-expression': 'error',     // Eval injection prevention
              'security/detect-no-csrf-before-method-override': 'error', // CSRF protection
              'security/detect-possible-timing-attacks': 'warn',   // Timing attack detection
              'security/detect-pseudoRandomBytes': 'error'         // Secure random generation
            }
          };
          ```
          
          #### 📋 Common Node.js Security Patterns Detected by ESLint
          
          1. **Command Injection Prevention**
          ```javascript
          // ❌ Vulnerable: Command injection risk
          const { exec } = require('child_process');
          exec(`ls ${userInput}`); // User input directly in command
          
          // ✅ Secure: Input validation and sanitization
          const { execFile } = require('child_process');
          const allowedCommands = ['ls', 'pwd'];
          if (allowedCommands.includes(command)) {
            execFile(command, sanitizedArgs);
          }
          ```
          
          2. **Regular Expression DoS (ReDoS) Prevention**
          ```javascript
          // ❌ Vulnerable: Catastrophic backtracking
          const vulnerableRegex = /^(a+)+$/;
          vulnerableRegex.test(userInput); // ReDoS attack vector
          
          // ✅ Secure: Non-catastrophic regex pattern
          const secureRegex = /^a+$/;
          secureRegex.test(userInput);
          ```
          
          3. **Object Injection Prevention**
          ```javascript
          // ❌ Vulnerable: Object prototype pollution
          const merge = (target, source) => {
            for (let key in source) {
              target[key] = source[key]; // Prototype pollution risk
            }
          };
          
          // ✅ Secure: Prototype pollution prevention
          const merge = (target, source) => {
            for (let key in source) {
              if (source.hasOwnProperty(key) && key !== '__proto__') {
                target[key] = source[key];
              }
            }
          };
          ```
          
