  # =============================================================================
  # SECRET AND CREDENTIAL DETECTION JOB  
  # =============================================================================
  # Comprehensive secret and credential detection using TruffleHog with Git history
  # analysis, custom patterns, and educational reporting for secure development practices
  secret-credential-detection:
    name: 🔍 Secret and Credential Detection
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    needs: [security-environment-setup]
    if: needs.security-environment-setup.outputs.secret-scan-enabled == 'true'
    
    steps:
      # Repository checkout with complete Git history for comprehensive secret scanning
      - name: 📥 Checkout Repository with Complete Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0                    # Complete Git history for comprehensive analysis
          token: ${{ secrets.GITHUB_TOKEN }}

      # TruffleHog secret detection tool installation and configuration
      - name: 🔧 Install TruffleHog Secret Detection Tool
        run: |
          echo "🔒 Installing TruffleHog secret detection tool for comprehensive analysis"
          
          # Install TruffleHog using official installation script
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin v3.63.2
          
          # Verify TruffleHog installation
          trufflehog --version
          
          echo "✅ TruffleHog secret detection tool installed successfully"

      # Comprehensive Git repository secret scanning with TruffleHog
      - name: 🔍 Execute Comprehensive Git Repository Secret Scan
        run: |
          echo "🔒 Executing comprehensive Git repository secret and credential detection"
          
          # Create secret detection output directory
          mkdir -p ${{ env.SCAN_OUTPUT_DIR }}/secret-detection
          
          # Execute TruffleHog Git repository scan with comprehensive analysis
          echo "📊 Running TruffleHog secret detection on Git repository history"
          
          # Scan Git repository with JSON output for programmatic analysis
          trufflehog git \
            --json \
            --output ${{ env.SCAN_OUTPUT_DIR }}/secret-detection/trufflehog-results.json \
            --no-verification \
            --entropy-threshold 3.5 \
            --max-depth 100 \
            . || true
          
          # Human-readable TruffleHog report for analysis
          trufflehog git \
            --output ${{ env.SCAN_OUTPUT_DIR }}/secret-detection/trufflehog-report.txt \
            --no-verification \
            --entropy-threshold 3.5 \
            --max-depth 100 \
            . || true
          
          # Extract secret detection summary for analysis  
          if [[ -f "${{ env.SCAN_OUTPUT_DIR }}/secret-detection/trufflehog-results.json" ]]; then
            echo "📈 Extracting secret detection metrics from scan results"
            
            # Count secrets by verification status and type
            VERIFIED_SECRETS=$(jq '[.[] | select(.verified == true)] | length' ${{ env.SCAN_OUTPUT_DIR }}/secret-detection/trufflehog-results.json)
            UNVERIFIED_SECRETS=$(jq '[.[] | select(.verified == false)] | length' ${{ env.SCAN_OUTPUT_DIR }}/secret-detection/trufflehog-results.json)
            TOTAL_SECRETS=$(jq '. | length' ${{ env.SCAN_OUTPUT_DIR }}/secret-detection/trufflehog-results.json)
            
            echo "🔒 Secret Detection Summary:"
            echo "   Verified Secrets: ${VERIFIED_SECRETS}"
            echo "   Unverified Secrets: ${UNVERIFIED_SECRETS}"
            echo "   Total Potential Secrets: ${TOTAL_SECRETS}"
            
            # Create secret detection summary
            cat > ${{ env.SCAN_OUTPUT_DIR }}/secret-detection/secret-detection-summary.json << EOF
          {
            "scan_type": "trufflehog_git",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "repository": "${{ github.repository }}",
            "secrets": {
              "verified": ${VERIFIED_SECRETS},
              "unverified": ${UNVERIFIED_SECRETS},
              "total": ${TOTAL_SECRETS}
            },
            "scan_depth": "full_git_history"
          }
          EOF
            
            echo "✅ Secret detection analysis completed successfully"
          else
            echo "⚠️ TruffleHog results not generated - creating empty summary"
            echo '{"scan_type": "trufflehog_git", "secrets": {"verified": 0, "unverified": 0, "total": 0}}' > ${{ env.SCAN_OUTPUT_DIR }}/secret-detection/secret-detection-summary.json
          fi

      # Configuration file and environment template secret analysis
      - name: 🔍 Scan Configuration Files for Credential Patterns
        run: |
          echo "🔒 Scanning configuration files and environment templates for credential patterns"
          
          # Scan specific file types for configuration-based secrets
          echo "📊 Analyzing configuration files for hardcoded credentials"
          
          # Find and analyze configuration files for secrets
          find . -type f \( -name "*.env*" -o -name "*.config.*" -o -name "*.json" -o -name "*.yml" -o -name "*.yaml" \) \
            -not -path "./node_modules/*" \
            -not -path "./.git/*" \
            -not -path "./coverage/*" \
            > ${{ env.SCAN_OUTPUT_DIR }}/secret-detection/config-files-list.txt
          
          # Scan configuration files with TruffleHog
          if [[ -s "${{ env.SCAN_OUTPUT_DIR }}/secret-detection/config-files-list.txt" ]]; then
            echo "📋 Configuration files found for secret scanning:"
            cat ${{ env.SCAN_OUTPUT_DIR }}/secret-detection/config-files-list.txt
            
            # Scan each configuration file individually
            while IFS= read -r config_file; do
              if [[ -f "$config_file" ]]; then
                echo "🔍 Scanning configuration file: $config_file"
                trufflehog filesystem \
                  --json \
                  --no-verification \
                  "$config_file" >> ${{ env.SCAN_OUTPUT_DIR }}/secret-detection/config-secrets.json 2>/dev/null || true
              fi
            done < ${{ env.SCAN_OUTPUT_DIR }}/secret-detection/config-files-list.txt
            
            # Count configuration file secrets
            if [[ -f "${{ env.SCAN_OUTPUT_DIR }}/secret-detection/config-secrets.json" ]]; then
              CONFIG_SECRETS=$(jq -s 'add | length' ${{ env.SCAN_OUTPUT_DIR }}/secret-detection/config-secrets.json 2>/dev/null || echo "0")
              echo "🔒 Configuration files secret analysis found ${CONFIG_SECRETS} potential issues"
              
              # Update secret summary with configuration findings
              jq --argjson config_secrets "${CONFIG_SECRETS}" '. + {"config_file_secrets": $config_secrets}' ${{ env.SCAN_OUTPUT_DIR }}/secret-detection/secret-detection-summary.json > ${{ env.SCAN_OUTPUT_DIR }}/secret-detection/secret-summary-temp.json
              mv ${{ env.SCAN_OUTPUT_DIR }}/secret-detection/secret-summary-temp.json ${{ env.SCAN_OUTPUT_DIR }}/secret-detection/secret-detection-summary.json
            fi
          else
            echo "ℹ️ No configuration files found for secret scanning"
          fi

      # Custom secret pattern detection for Node.js specific credentials
      - name: 🔍 Execute Custom Node.js Secret Pattern Detection
        run: |
          echo "🔒 Executing custom Node.js specific secret pattern detection"
          
          # Create custom secret patterns for Node.js applications
          cat > ${{ env.SCAN_OUTPUT_DIR }}/secret-detection/nodejs-secret-patterns.txt << 'EOF'
          # Node.js specific secret patterns
          JWT_SECRET.*=.*[\"']([A-Za-z0-9+/]{32,})[\"']
          DATABASE_URL.*=.*[\"'](postgresql://|mysql://|mongodb://)([^\"']+)[\"']
          API_KEY.*=.*[\"']([A-Za-z0-9]{20,})[\"']
          STRIPE_.*KEY.*=.*[\"'](sk_|pk_)([A-Za-z0-9]{20,})[\"']
          AWS_.*KEY.*=.*[\"'](AKIA[A-Z0-9]{16})[\"']
          GITHUB_TOKEN.*=.*[\"'](ghp_|gho_|ghu_|ghs_|ghr_)([A-Za-z0-9]{36})[\"']
          NPM_TOKEN.*=.*[\"'](npm_[A-Za-z0-9]{36})[\"']
          DISCORD_.*TOKEN.*=.*[\"']([A-Za-z0-9]{24}\.[A-Za-z0-9]{6}\.[A-Za-z0-9]{27})[\"']
          EOF
          
          # Search for custom patterns in source code
          echo "📊 Searching for custom Node.js secret patterns"
          grep -r -n -H -E -f ${{ env.SCAN_OUTPUT_DIR }}/secret-detection/nodejs-secret-patterns.txt \
            --include="*.js" --include="*.ts" --include="*.json" --include="*.env*" \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=coverage \
            . > ${{ env.SCAN_OUTPUT_DIR }}/secret-detection/custom-pattern-matches.txt 2>/dev/null || true
          
          # Count custom pattern matches
          if [[ -s "${{ env.SCAN_OUTPUT_DIR }}/secret-detection/custom-pattern-matches.txt" ]]; then
            CUSTOM_MATCHES=$(wc -l < ${{ env.SCAN_OUTPUT_DIR }}/secret-detection/custom-pattern-matches.txt)
            echo "🔒 Custom Node.js secret pattern analysis found ${CUSTOM_MATCHES} potential matches"
            
            # Update secret summary with custom pattern findings
            jq --argjson custom_matches "${CUSTOM_MATCHES}" '. + {"custom_pattern_matches": $custom_matches}' ${{ env.SCAN_OUTPUT_DIR }}/secret-detection/secret-detection-summary.json > ${{ env.SCAN_OUTPUT_DIR }}/secret-detection/secret-summary-temp.json
            mv ${{ env.SCAN_OUTPUT_DIR }}/secret-detection/secret-summary-temp.json ${{ env.SCAN_OUTPUT_DIR }}/secret-detection/secret-detection-summary.json
          else
            echo "✅ No custom Node.js secret patterns detected"
            jq '. + {"custom_pattern_matches": 0}' ${{ env.SCAN_OUTPUT_DIR }}/secret-detection/secret-detection-summary.json > ${{ env.SCAN_OUTPUT_DIR }}/secret-detection/secret-summary-temp.json
            mv ${{ env.SCAN_OUTPUT_DIR }}/secret-detection/secret-summary-temp.json ${{ env.SCAN_OUTPUT_DIR }}/secret-detection/secret-detection-summary.json
          fi

      # Educational secret management report generation with security best practices
      - name: 📚 Generate Educational Secret Management Security Report
        if: env.GENERATE_EDUCATIONAL_REPORT == 'true'
        run: |
          echo "🔒 Generating comprehensive educational secret management security report"
          
          # Extract secret detection metrics for educational content
          VERIFIED=$(jq -r '.secrets.verified // 0' ${{ env.SCAN_OUTPUT_DIR }}/secret-detection/secret-detection-summary.json)
          UNVERIFIED=$(jq -r '.secrets.unverified // 0' ${{ env.SCAN_OUTPUT_DIR }}/secret-detection/secret-detection-summary.json)
          TOTAL=$(jq -r '.secrets.total // 0' ${{ env.SCAN_OUTPUT_DIR }}/secret-detection/secret-detection-summary.json)
          CONFIG_SECRETS=$(jq -r '.config_file_secrets // 0' ${{ env.SCAN_OUTPUT_DIR }}/secret-detection/secret-detection-summary.json)
          CUSTOM_MATCHES=$(jq -r '.custom_pattern_matches // 0' ${{ env.SCAN_OUTPUT_DIR }}/secret-detection/secret-detection-summary.json)
          
          # Generate comprehensive educational secret management report
          cat > ${{ env.SCAN_OUTPUT_DIR }}/educational-materials/secret-management-guide.md << 'EOF'
          # 🔍 Secret and Credential Management - Educational Guide
          
          ## 🎯 Learning Objectives
          
          Through this secret detection and credential management analysis, you will learn:
          
          - Understanding secret detection fundamentals and security implications of exposed credentials
          - Implementing comprehensive secret scanning with TruffleHog and custom pattern detection
          - Applying secure secret management practices for Node.js applications and development workflows  
          - Integrating secret detection into CI/CD pipelines for continuous security validation
          - Learning environment variable security and runtime secret management techniques
          - Understanding Git history analysis and preventing accidental credential exposure
          
          ## 📊 Secret Detection Analysis Summary
          
          ### 🔍 Secret Detection Results Overview
          
          | Detection Method | Findings Count | Verification Status | Risk Assessment |
          |---|---|---|---|
          | **TruffleHog Git Scan** | TOTAL_PLACEHOLDER findings | VERIFIED_PLACEHOLDER verified, UNVERIFIED_PLACEHOLDER unverified | Git history analysis |
          | **Configuration Files** | CONFIG_SECRETS_PLACEHOLDER patterns | Pattern-based detection | Configuration analysis |
          | **Custom Node.js Patterns** | CUSTOM_MATCHES_PLACEHOLDER matches | Manual verification required | Application-specific patterns |
          
          ### 📈 Secret Exposure Risk Analysis
          
          - **Verified Secrets Found**: VERIFIED_PLACEHOLDER (Immediate security risk)
          - **Unverified Potential Secrets**: UNVERIFIED_PLACEHOLDER (Requires manual review)
          - **Configuration File Issues**: CONFIG_SECRETS_PLACEHOLDER (Hardcoded credential patterns)
          - **Custom Pattern Matches**: CUSTOM_MATCHES_PLACEHOLDER (Node.js specific patterns)
          
          ## 🔍 Understanding Secret Detection and Management
          
          ### 📚 What are Secrets and Why They Matter?
          
          **Secrets** are sensitive pieces of information that provide access to systems, services, or data. In software development, secrets include API keys, database passwords, encryption keys, tokens, and certificates that must be protected from unauthorized access.
          
          #### 🚨 Common Secret Types in Node.js Applications
          
          1. **API Keys and Tokens**: Third-party service authentication credentials
          2. **Database Credentials**: Connection strings, usernames, and passwords  
          3. **JWT Secrets**: Signing keys for JSON Web Token authentication
          4. **Encryption Keys**: Symmetric and asymmetric encryption keys
          5. **Certificate Files**: SSL/TLS certificates and private keys
          6. **OAuth Credentials**: Client IDs, client secrets, and refresh tokens
          
          #### 🔐 Secret Exposure Risk Categories
          
          - **High Risk**: Verified active credentials with immediate access potential
          - **Medium Risk**: Unverified credentials requiring validation and analysis
          - **Low Risk**: Pattern matches requiring manual review for false positives
          - **Configuration Risk**: Hardcoded credentials in configuration files
          
          ## 🛡️ Secret Detection Analysis Deep Dive
          
          ### ✅ Verified Secrets (VERIFIED_PLACEHOLDER found)
          
          **Verified secrets** are credentials that have been confirmed as active and functional through API validation or pattern verification.
          
          #### 🚨 Immediate Actions Required for Verified Secrets
          
          ```bash
          # Critical incident response for verified secret exposure
          
          # 1. Immediately revoke exposed credentials
          # For API keys:
          curl -X DELETE https://api.service.com/keys/EXPOSED_KEY_ID \
            -H "Authorization: Bearer ADMIN_TOKEN"
          
          # For database credentials:
          # Connect to database and change passwords immediately
          ALTER USER 'exposed_user'@'%' IDENTIFIED BY 'new_secure_password';
          
          # 2. Rotate secrets with new secure values
          # Generate new API key
          NEW_API_KEY=$(openssl rand -hex 32)
          
          # 3. Update application configuration
          # Use environment variables or secure secret management
          export API_KEY="${NEW_API_KEY}"
          
          # 4. Remove from Git history (if committed)
          git filter-branch --force --index-filter \
            'git rm --cached --ignore-unmatch path/to/file/with/secret' \
            --prune-empty --tag-name-filter cat -- --all
          
          # 5. Force push cleaned repository (coordinate with team)
          git push --force --all
          git push --force --tags