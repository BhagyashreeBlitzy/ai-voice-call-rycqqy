          # Update container summary with image metadata
          jq --argjson image_size "${IMAGE_SIZE}" --argjson layer_count "${IMAGE_LAYERS}" '. + {"image_size": $image_size, "layer_count": $layer_count}' ${{ env.SCAN_OUTPUT_DIR }}/container-scan/container-vulnerability-summary.json > ${{ env.SCAN_OUTPUT_DIR }}/container-scan/container-summary-temp.json
          mv ${{ env.SCAN_OUTPUT_DIR }}/container-scan/container-summary-temp.json ${{ env.SCAN_OUTPUT_DIR }}/container-scan/container-vulnerability-summary.json
          
