          # Extract Dockerfile configuration findings
          if [[ -f "${{ env.SCAN_OUTPUT_DIR }}/container-scan/dockerfile-config-results.json" ]]; then
            CONFIG_ISSUES=$(jq '[.Results[]?.Misconfigurations[]?] | length' ${{ env.SCAN_OUTPUT_DIR }}/container-scan/dockerfile-config-results.json)
            echo "🔒 Dockerfile configuration analysis found ${CONFIG_ISSUES} potential issues"
            
            # Update container summary with configuration findings
            jq --argjson config_issues "${CONFIG_ISSUES}" '. + {"dockerfile_config_issues": $config_issues}' ${{ env.SCAN_OUTPUT_DIR }}/container-scan/container-vulnerability-summary.json > ${{ env.SCAN_OUTPUT_DIR }}/container-scan/container-summary-temp.json
            mv ${{ env.SCAN_OUTPUT_DIR }}/container-scan/container-summary-temp.json ${{ env.SCAN_OUTPUT_DIR }}/container-scan/container-vulnerability-summary.json
            
