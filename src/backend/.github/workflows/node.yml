# GitHub Actions CI/CD Workflow for Node.js Tutorial Backend
# This workflow provides comprehensive continuous integration and deployment automation
# for the Node.js tutorial backend application with Express.js v5.1.0 and Node.js v22.x LTS.
#
# Features:
# - Multi-version Node.js testing matrix (18.x, 20.x, 22.x LTS)
# - Dependency installation with npm ci for reproducible builds
# - Code quality checks with ESLint and Prettier
# - Security vulnerability scanning with npm audit
# - Comprehensive test execution with Jest and Supertest
# - Code coverage reporting and artifact collection
# - Build verification with application startup testing
# - Caching optimization for faster workflow execution
# - Educational clarity with detailed step documentation
#
# Compatibility:
# - Node.js: v18.0.0+ (supports v18.x, v20.x, v22.x LTS)
# - Express.js: v5.1.0 with security enhancements
# - Jest: v29.0.0+ with built-in coverage and mocking
# - npm: v8.0.0+ with package-lock.json support
#
# Educational Purpose:
# This workflow demonstrates modern CI/CD practices for Node.js applications,
# including automated testing, security scanning, code quality enforcement,
# and deployment readiness verification suitable for production environments.

name: Node.js CI/CD Pipeline

# Workflow triggers for comprehensive CI/CD coverage
# Executes on push events to main branches and all pull request events
# Enables both continuous integration and pull request validation workflows
on:
  push:
    branches: 
      - main
      - master
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches:
      - main
      - master
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
    # Manual workflow triggering for testing and debugging

# Workflow-level environment variables
env:
  NODE_ENV: test
  CI: true
  FORCE_COLOR: 1
  NPM_CONFIG_PROGRESS: false
  NPM_CONFIG_FUND: false
  NPM_CONFIG_AUDIT: false

# Define workflow jobs
jobs:
  # Main CI job for build, test, and quality validation
  ci:
    name: CI Pipeline (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    
    # Matrix strategy for testing across multiple Node.js versions
    # Tests against LTS versions and current stable release
    # Ensures compatibility across the supported Node.js ecosystem
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
      fail-fast: false # Continue testing other versions if one fails
    
    # Job-level environment variables
    env:
      NODE_VERSION: ${{ matrix.node-version }}
    
    steps:
    # Step 1: Repository checkout using latest action version
    # Retrieves the complete repository code including submodules and history
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # Fetch minimal history for performance while ensuring complete code access
        fetch-depth: 1
        # Include submodules if present
        submodules: false
        # Clean checkout to ensure no local modifications
        clean: true
    
    # Step 2: Node.js environment setup with caching optimization
    # Configures the specified Node.js version with npm caching for faster builds
    - name: Setup Node.js environment
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        # Use package-lock.json for consistent dependency versions
        cache: 'npm'
        cache-dependency-path: 'src/backend/package-lock.json'
        # Ensure npm is up-to-date for security and performance
        check-latest: true
    
    # Step 3: Display environment information for debugging and transparency
    # Provides visibility into the CI environment for troubleshooting
    - name: Display environment information
      run: |
        echo "Node.js version: $(node --version)"
        echo "npm version: $(npm --version)"
        echo "Operating system: $(uname -a)"
        echo "Working directory: $(pwd)"
        echo "Available memory: $(free -h)"
        echo "Disk space: $(df -h)"
        echo "Environment variables:"
        echo "  NODE_ENV: $NODE_ENV"
        echo "  CI: $CI"
        echo "  NODE_VERSION: $NODE_VERSION"
    
    # Step 4: Navigate to backend directory
    # All subsequent steps execute within the backend application context
    - name: Navigate to backend directory
      run: cd src/backend
      
    # Step 5: Install dependencies using npm ci for reproducible builds
    # Uses package-lock.json to ensure exact dependency versions
    # Provides faster, reliable, and reproducible builds compared to npm install
    - name: Install dependencies
      run: |
        cd src/backend
        echo "Installing dependencies with npm ci..."
        npm ci --prefer-offline --no-audit --no-fund
        echo "Dependencies installed successfully"
        echo "Installed packages:"
        npm list --depth=0
      env:
        # Optimize npm performance and reduce noise
        NPM_CONFIG_LOGLEVEL: warn
        NPM_CONFIG_PROGRESS: false
    
    # Step 6: Validate package.json and package-lock.json integrity
    # Ensures package configuration is valid and lock file is synchronized
    - name: Validate package configuration
      run: |
        cd src/backend
        echo "Validating package.json..."
        npm run health --if-present
        echo "Checking package-lock.json integrity..."
        npm ls --depth=0
        echo "Package validation completed successfully"
    
    # Step 7: Run ESLint for code quality and standards enforcement
    # Enforces coding standards, identifies potential issues, and ensures maintainability
    - name: Run ESLint code analysis
      run: |
        cd src/backend
        echo "Running ESLint analysis..."
        npm run lint
        echo "ESLint analysis completed successfully"
    
    # Step 8: Run Prettier for code formatting validation
    # Ensures consistent code formatting across the entire codebase
    - name: Check code formatting with Prettier
      run: |
        cd src/backend
        echo "Checking code formatting with Prettier..."
        npm run format:check
        echo "Code formatting validation completed successfully"
    
    # Step 9: Run security audit with npm audit
    # Identifies known security vulnerabilities in dependencies
    # Fails on high-severity vulnerabilities to maintain security standards
    - name: Run security vulnerability scan
      run: |
        cd src/backend
        echo "Running security audit..."
        npm audit --audit-level=high
        echo "Security audit completed successfully"
    
    # Step 10: Execute comprehensive test suite
    # Runs unit tests, integration tests, and generates code coverage reports
    - name: Run test suite with coverage
      run: |
        cd src/backend
        echo "Executing test suite..."
        npm run test:ci
        echo "Test suite completed successfully"
      env:
        # Optimize test execution for CI environment
        NODE_ENV: test
        CI: true
        JEST_WORKERS: 2
    
    # Step 11: Upload code coverage reports as workflow artifacts
    # Preserves coverage data for analysis and historical tracking
    - name: Upload code coverage reports
      uses: actions/upload-artifact@v4
      if: always() # Upload even if tests fail
      with:
        name: coverage-report-node-${{ matrix.node-version }}
        path: src/backend/coverage/
        retention-days: 30
        if-no-files-found: warn
    
    # Step 12: Upload test results as workflow artifacts
    # Provides detailed test execution results for analysis
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always() # Upload even if tests fail
      with:
        name: test-results-node-${{ matrix.node-version }}
        path: |
          src/backend/test-results.xml
          src/backend/junit.xml
        retention-days: 30
        if-no-files-found: ignore
    
    # Step 13: Verify application startup and health check
    # Ensures the application can start successfully and respond to health checks
    - name: Verify application startup
      run: |
        cd src/backend
        echo "Starting application for verification..."
        
        # Start the application in background
        npm start &
        SERVER_PID=$!
        
        # Wait for server to start
        echo "Waiting for server to start..."
        sleep 10
        
        # Check if server is responding
        echo "Testing server health..."
        curl -f http://localhost:3000/hello || exit 1
        
        # Test health endpoint if available
        curl -f http://localhost:3000/health || echo "Health endpoint not available"
        
        # Stop the server
        echo "Stopping server..."
        kill $SERVER_PID || true
        wait $SERVER_PID 2>/dev/null || true
        
        echo "Application startup verification completed successfully"
      timeout-minutes: 5
    
    # Step 14: Build verification (if build script exists)
    # Verifies that the application can be built successfully
    - name: Verify build process
      run: |
        cd src/backend
        if npm run build --if-present; then
          echo "Build verification completed successfully"
        else
          echo "No build script found - skipping build verification"
        fi
    
    # Step 15: Generate workflow summary
    # Provides a comprehensive summary of the CI pipeline execution
    - name: Generate workflow summary
      if: always()
      run: |
        cd src/backend
        echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Node.js Version**: ${{ matrix.node-version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **npm Version**: $(npm --version)" >> $GITHUB_STEP_SUMMARY
        echo "- **Repository**: ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Workflow**: ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Job Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Package Information" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        npm list --depth=0 2>/dev/null || echo "Package list not available"
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Test Coverage" >> $GITHUB_STEP_SUMMARY
        if [ -f "coverage/coverage-summary.json" ]; then
          echo "Coverage report available in artifacts" >> $GITHUB_STEP_SUMMARY
        else
          echo "Coverage report not generated" >> $GITHUB_STEP_SUMMARY
        fi
  
  # Additional job for deployment readiness verification
  deployment-readiness:
    name: Deployment Readiness Check
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js (LTS)
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: 'src/backend/package-lock.json'
    
    - name: Install dependencies
      run: |
        cd src/backend
        npm ci --prefer-offline --no-audit --no-fund
    
    - name: Production build verification
      run: |
        cd src/backend
        echo "Verifying production readiness..."
        NODE_ENV=production npm start &
        SERVER_PID=$!
        
        # Wait for server to start
        sleep 15
        
        # Verify server is running
        if curl -f http://localhost:3000/hello; then
          echo "Production server verification successful"
        else
          echo "Production server verification failed"
          exit 1
        fi
        
        # Stop server
        kill $SERVER_PID || true
        wait $SERVER_PID 2>/dev/null || true
    
    - name: Security compliance check
      run: |
        cd src/backend
        echo "Running comprehensive security scan..."
        npm audit --audit-level=moderate
        
        # Check for outdated packages
        echo "Checking for outdated packages..."
        npm outdated || echo "Some packages may be outdated"
        
        echo "Security compliance check completed"
    
    - name: Performance baseline test
      run: |
        cd src/backend
        echo "Running performance baseline test..."
        npm start &
        SERVER_PID=$!
        
        # Wait for server to start
        sleep 10
        
        # Simple performance test
        echo "Testing response time..."
        time curl -w "Time: %{time_total}s\n" -o /dev/null -s http://localhost:3000/hello
        
        # Stop server
        kill $SERVER_PID || true
        wait $SERVER_PID 2>/dev/null || true
        
        echo "Performance baseline test completed"
      timeout-minutes: 5