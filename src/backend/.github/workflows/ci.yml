          ### 9.2 Structured Logging
          ```javascript
          // src/utils/logger.js
          const logger = {
            info: (message, meta = {}) => {
              console.log(JSON.stringify({
                level: 'info',
                message,
                timestamp: new Date().toISOString(),
                ...meta
              }));
            },
            
            error: (message, error = {}) => {
              console.error(JSON.stringify({
                level: 'error', 
                message,
                timestamp: new Date().toISOString(),
                error: {
                  name: error.name,
                  message: error.message,
                  stack: error.stack
