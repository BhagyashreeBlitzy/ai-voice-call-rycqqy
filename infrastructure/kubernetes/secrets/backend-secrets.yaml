# Kubernetes Secret manifest for securely injecting sensitive environment variables
# into the Node.js tutorial backend deployment.
#
# This Secret provides base64-encoded values for all environment variables required
# by the backend application, enabling secure, declarative configuration management
# in Kubernetes clusters while supporting Twelve-Factor App principles.
#
# Security Note: This file contains example/placeholder values. In production,
# replace these with actual secret values and never commit real secrets to version control.
# Use CI/CD pipelines or secure secret management tools to populate real values.
#
# Usage:
#   kubectl apply -f backend-secrets.yaml
#   kubectl get secret backend-secrets
#   kubectl describe secret backend-secrets
#
# To decode values (for debugging):
#   kubectl get secret backend-secrets -o jsonpath='{.data.PORT}' | base64 -d
#
# Referenced by: infrastructure/kubernetes/deployments/backend-deployment.yaml

apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: default
  labels:
    app: nodejs-tutorial-backend
    component: backend
    version: v1.0.0
    environment: production
  annotations:
    description: "Environment variables for Node.js tutorial backend deployment"
    kubernetes.io/managed-by: "kubectl"
    tutorial.example.com/config-version: "1.0"
    tutorial.example.com/last-updated: "2024-01-15T10:30:00Z"
type: Opaque
data:
  # HTTP server port configuration
  # The port number the Node.js HTTP server will bind to for incoming connections
  # Must be between 1024-65535 (avoiding privileged ports)
  # Default production value: 3000
  # Base64 encoded value of "3000"
  PORT: "MzAwMA=="
  
  # Node.js environment setting
  # Controls Express.js behavior, logging verbosity, and error handling patterns
  # Valid values: development, production, test
  # Production value: production (enables security optimizations and performance enhancements)
  # Base64 encoded value of "production"
  NODE_ENV: "cHJvZHVjdGlvbg=="
  
  # HTTP request timeout in milliseconds
  # Prevents hanging connections and resource exhaustion in production deployments
  # Value must be a positive integer representing milliseconds
  # Production value: 30000 (30 seconds - balances user experience with server protection)
  # Base64 encoded value of "30000"
  REQUEST_TIMEOUT_MS: "MzAwMDA="

---
# ConfigMap for non-sensitive configuration values
# Provides complementary configuration that doesn't require secrecy
# but supports the backend application's runtime configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: default
  labels:
    app: nodejs-tutorial-backend
    component: backend
    version: v1.0.0
    environment: production
  annotations:
    description: "Non-sensitive configuration for Node.js tutorial backend"
    kubernetes.io/managed-by: "kubectl"
    tutorial.example.com/config-version: "1.0"
data:
  # Application metadata
  APP_NAME: "nodejs-tutorial-backend"
  APP_VERSION: "1.0.0"
  
  # Logging configuration (non-sensitive)
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  
  # Health check configuration
  HEALTH_CHECK_PATH: "/health"
  HEALTH_CHECK_INTERVAL: "30s"
  
  # Application description
  APP_DESCRIPTION: "Node.js tutorial application demonstrating HTTP server fundamentals"