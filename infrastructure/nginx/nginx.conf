# =============================================================================
# NGINX Main Configuration File
# =============================================================================
# Primary NGINX configuration file for the Node.js tutorial application.
# Acts as the main entry point for the NGINX reverse proxy, defining global
# settings, HTTP server blocks, upstream backend configuration, security and
# performance directives, and including modular configuration from supplemental
# files. Designed to route HTTP(S) traffic to the backend Express server,
# serve static files if needed, enforce security best practices, and provide
# a maintainable, production-ready reverse proxy layer for containerized or
# cloud deployments.
# =============================================================================

# -----------------------------------------------------------------------------
# GLOBAL NGINX SETTINGS
# -----------------------------------------------------------------------------
# Core NGINX process configuration and global directives

# Run NGINX as the nginx user for security
user nginx;

# Use automatic worker process count based on CPU cores
worker_processes auto;

# Configure global error logging
error_log /var/log/nginx/error.log warn;

# PID file location for process management
pid /var/run/nginx.pid;

# -----------------------------------------------------------------------------
# EVENTS BLOCK CONFIGURATION
# -----------------------------------------------------------------------------
# Event-driven processing configuration for connection handling

events {
    # Maximum number of simultaneous connections per worker process
    worker_connections 1024;
    
    # Use epoll for better performance on Linux
    use epoll;
    
    # Accept multiple connections at once
    multi_accept on;
    
    # Worker process accepts new connections one at a time
    accept_mutex off;
}

# -----------------------------------------------------------------------------
# HTTP BLOCK CONFIGURATION
# -----------------------------------------------------------------------------
# Main HTTP server configuration with security and performance settings

http {
    # -----------------------------------------------------------------------------
    # MIME TYPES AND BASIC SETTINGS
    # -----------------------------------------------------------------------------
    
    # Include MIME type definitions
    include /etc/nginx/mime.types;
    
    # Default MIME type for unknown file extensions
    default_type application/octet-stream;
    
    # -----------------------------------------------------------------------------
    # LOGGING CONFIGURATION
    # -----------------------------------------------------------------------------
    
    # Define comprehensive log format with security information
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for" '
                   '$request_time $upstream_response_time';
    
    # Define security-focused log format
    log_format security '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" '
                       '$request_time $upstream_response_time '
                       '$connection $connection_requests';
    
    # Configure access logging
    access_log /var/log/nginx/access.log main;
    
    # -----------------------------------------------------------------------------
    # PERFORMANCE OPTIMIZATION SETTINGS
    # -----------------------------------------------------------------------------
    
    # Enable sendfile for better file serving performance
    sendfile on;
    
    # Optimize sendfile for large files
    tcp_nopush on;
    
    # Improve TCP performance
    tcp_nodelay on;
    
    # Client connection keep-alive timeout
    keepalive_timeout 65;
    
    # Keep-alive requests per connection
    keepalive_requests 1000;
    
    # Client request timeout
    client_body_timeout 12;
    client_header_timeout 12;
    
    # Send timeout for client connections
    send_timeout 10;
    
    # Client body and header size limits
    client_max_body_size 1m;
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 1k;
    
    # -----------------------------------------------------------------------------
    # SECURITY SETTINGS
    # -----------------------------------------------------------------------------
    
    # Hide NGINX version information
    server_tokens off;
    
    # Disable automatic index generation
    autoindex off;
    
    # -----------------------------------------------------------------------------
    # GZIP COMPRESSION CONFIGURATION
    # -----------------------------------------------------------------------------
    
    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/rss+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/svg+xml
        image/x-icon
        text/css
        text/javascript
        text/plain
        text/x-component;
    
    # -----------------------------------------------------------------------------
    # RATE LIMITING CONFIGURATION
    # -----------------------------------------------------------------------------
    
    # Define rate limiting zones for API endpoints
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;
    
    # Define connection limiting zone
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    
    # Set status codes for rate limiting
    limit_req_status 429;
    limit_conn_status 429;
    
    # -----------------------------------------------------------------------------
    # UPSTREAM BACKEND CONFIGURATION
    # -----------------------------------------------------------------------------
    
    # Define upstream backend server for the Node.js Express application
    upstream backend {
        # Backend server running on port 3000
        server backend:3000;
        
        # Alternative localhost configuration for development
        # server 127.0.0.1:3000;
        
        # Health check and failover settings
        keepalive 32;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }
    
    # -----------------------------------------------------------------------------
    # MAIN SERVER BLOCK CONFIGURATION
    # -----------------------------------------------------------------------------
    
    server {
        # Listen on port 80 for HTTP traffic
        listen 80;
        
        # Server name configuration (catch-all for tutorial purposes)
        server_name _;
        
        # Document root (for static files and error pages)
        root /usr/share/nginx/html;
        
        # Index file priorities
        index index.html index.htm;
        
        # -----------------------------------------------------------------------------
        # GLOBAL SECURITY HEADERS
        # -----------------------------------------------------------------------------
        
        # Apply comprehensive security headers to all responses
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), accelerometer=(), gyroscope=(), magnetometer=(), payment=(), usb=(), interest-cohort=()" always;
        
        # Content Security Policy
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; child-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
        
        # Additional security headers
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        
        # -----------------------------------------------------------------------------
        # CONNECTION AND RATE LIMITING
        # -----------------------------------------------------------------------------
        
        # Limit concurrent connections per IP
        limit_conn conn_limit 20;
        
        # Apply general rate limiting to all requests
        limit_req zone=general_limit burst=50 nodelay;
        
        # -----------------------------------------------------------------------------
        # MAIN LOCATION BLOCKS
        # -----------------------------------------------------------------------------
        
        # Root location - proxy all requests to backend Express server
        location / {
            # Proxy to upstream backend
            proxy_pass http://backend;
            
            # Essential proxy headers for backend processing
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Proxy configuration for performance and reliability
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            
            # Proxy buffer configuration
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
            
            # Disable proxy caching for dynamic content
            proxy_cache_bypass 1;
            proxy_no_cache 1;
            
            # Security headers for proxied responses
            proxy_hide_header X-Powered-By;
            proxy_hide_header Server;
        }
        
        # Hello endpoint with specific rate limiting
        location /hello {
            # Apply API-specific rate limiting
            limit_req zone=api_limit burst=20 nodelay;
            
            # Proxy to upstream backend
            proxy_pass http://backend;
            
            # Essential proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Proxy configuration
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            
            # Security headers specific to API endpoints
            add_header X-RateLimit-Limit "10r/s" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            
            # Hide sensitive headers
            proxy_hide_header X-Powered-By;
            proxy_hide_header Server;
        }
        
        # -----------------------------------------------------------------------------
        # ERROR PAGE CONFIGURATION
        # -----------------------------------------------------------------------------
        
        # Custom error page definitions
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        error_page 429 /429.html;
        
        # 404 Not Found error page
        location = /404.html {
            internal;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;
        }
        
        # 5xx Server Error pages
        location = /50x.html {
            internal;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;
        }
        
        # Rate limit exceeded error page
        location = /429.html {
            internal;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Retry-After "60" always;
            add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;
        }
        
        # -----------------------------------------------------------------------------
        # HEALTH CHECK ENDPOINTS
        # -----------------------------------------------------------------------------
        
        # Health check endpoint for monitoring
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }
        
        # Status endpoint for load balancer health checks
        location /nginx-health {
            access_log off;
            return 200 "nginx-ok\n";
            add_header Content-Type text/plain always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }
        
        # -----------------------------------------------------------------------------
        # SECURITY HARDENING CONFIGURATIONS
        # -----------------------------------------------------------------------------
        
        # Deny access to hidden files and directories
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
            return 444;
        }
        
        # Deny access to backup and temporary files
        location ~* \.(bak|backup|swp|tmp|temp|log|ini|conf|config)$ {
            deny all;
            access_log off;
            log_not_found off;
            return 444;
        }
        
        # Deny access to version control directories
        location ~ /\.(git|svn|hg|bzr) {
            deny all;
            access_log off;
            log_not_found off;
            return 444;
        }
        
        # Block common attack patterns
        location ~* (union.*select|concat.*\(|base64_decode|script.*alert|javascript:|vbscript:|data:) {
            deny all;
            access_log off;
            log_not_found off;
            return 444;
        }
        
        # Deny access to common sensitive files
        location ~* ^/(wp-config|config|configuration|settings|local_settings|database|db_config)\.(php|inc|conf|config|txt)$ {
            deny all;
            access_log off;
            log_not_found off;
            return 444;
        }
        
        # -----------------------------------------------------------------------------
        # INCLUDE MODULAR CONFIGURATION
        # -----------------------------------------------------------------------------
        
        # Include additional configuration from default.conf
        # This provides static file serving, additional security headers,
        # enhanced rate limiting, and environment-specific overrides
        include /etc/nginx/conf.d/default.conf;
    }
    
    # -----------------------------------------------------------------------------
    # ADDITIONAL SERVER BLOCKS (OPTIONAL)
    # -----------------------------------------------------------------------------
    
    # Default server block for handling requests to undefined server names
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }
    
    # -----------------------------------------------------------------------------
    # INCLUDE ADDITIONAL CONFIGURATION FILES
    # -----------------------------------------------------------------------------
    
    # Include additional server configurations if needed
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}

# =============================================================================
# END OF NGINX CONFIGURATION
# =============================================================================
# This configuration provides a production-ready NGINX reverse proxy setup
# for the Node.js tutorial application with comprehensive security hardening,
# performance optimization, rate limiting, and modular configuration support.
# The setup routes HTTP traffic to the backend Express server while enforcing
# security best practices and providing robust error handling.
# =============================================================================