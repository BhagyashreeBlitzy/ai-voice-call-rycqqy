# =============================================================================
# NGINX Default Configuration Include File
# =============================================================================
# This file provides modular, overrideable configuration for static file 
# serving, custom error pages, additional security headers, and rate limiting.
# Designed to be included in the main server block for environment-specific
# or advanced configuration, supporting best practices for security, 
# performance, and maintainability in front of the Node.js/Express backend.
# =============================================================================

# -----------------------------------------------------------------------------
# STATIC FILE SERVING CONFIGURATION
# -----------------------------------------------------------------------------
# Serves static files (documentation, error pages, assets) from designated
# directories with security restrictions and performance optimizations

# Documentation and static assets serving
location /docs {
    root /usr/share/nginx/html;
    index index.html index.htm;
    
    # Security: Restrict to safe HTTP methods only
    limit_except GET HEAD {
        deny all;
    }
    
    # Performance: Set caching headers for static content
    expires 1h;
    add_header Cache-Control "public, no-transform" always;
    
    # Security: Additional headers for static content
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # Performance: Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    
    # Security: Prevent access to hidden files
    location ~ /\.ht {
        deny all;
    }
    
    # Security: Prevent access to sensitive file types
    location ~* \.(ini|conf|log|bak|backup|tmp)$ {
        deny all;
    }
}

# Static assets serving (CSS, JS, images)
location /static {
    root /usr/share/nginx/html;
    
    # Security: Restrict to safe HTTP methods only
    limit_except GET HEAD {
        deny all;
    }
    
    # Performance: Aggressive caching for static assets
    expires 7d;
    add_header Cache-Control "public, immutable, no-transform" always;
    
    # Security: Additional headers for static content
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    
    # Performance: Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json image/svg+xml;
    
    # Security: Prevent access to hidden files and sensitive types
    location ~ /\.ht {
        deny all;
    }
    
    location ~* \.(ini|conf|log|bak|backup|tmp)$ {
        deny all;
    }
}

# Favicon serving with optimized caching
location = /favicon.ico {
    root /usr/share/nginx/html;
    expires 30d;
    add_header Cache-Control "public, immutable" always;
    log_not_found off;
    access_log off;
}

# Robots.txt serving
location = /robots.txt {
    root /usr/share/nginx/html;
    expires 7d;
    add_header Cache-Control "public" always;
    log_not_found off;
    access_log off;
}

# -----------------------------------------------------------------------------
# CUSTOM ERROR PAGES CONFIGURATION
# -----------------------------------------------------------------------------
# Provides user-friendly error pages and prevents backend information leakage

# Custom error page definitions
error_page 404 /404.html;
error_page 502 503 504 /50x.html;

# 404 Not Found error page
location = /404.html {
    root /usr/share/nginx/html;
    internal;
    
    # Security: Additional headers for error pages
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    
    # Security: Prevent indexing of error pages
    add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;
}

# 502, 503, 504 Server Error pages
location = /50x.html {
    root /usr/share/nginx/html;
    internal;
    
    # Security: Additional headers for error pages
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    
    # Security: Prevent indexing of error pages
    add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;
}

# -----------------------------------------------------------------------------
# ADDITIONAL SECURITY HEADERS
# -----------------------------------------------------------------------------
# Implements comprehensive security headers to harden against common 
# web vulnerabilities and attacks

# Core security headers applied to all responses
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Content Security Policy - Restrictive policy for enhanced security
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; child-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

# Permissions Policy - Restrict access to browser APIs
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), accelerometer=(), gyroscope=(), magnetometer=(), payment=(), usb=(), interest-cohort=()" always;

# Additional security headers for enhanced protection
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Security: Remove server information disclosure
server_tokens off;
more_clear_headers Server;
more_set_headers "Server: WebServer";

# -----------------------------------------------------------------------------
# RATE LIMITING CONFIGURATION
# -----------------------------------------------------------------------------
# Implements location-specific rate limiting to mitigate abuse and DoS attacks

# Rate limiting for API endpoints
location /api {
    # Apply rate limiting with burst capacity
    limit_req zone=api_limit burst=20 nodelay;
    
    # Set status code for rate limit exceeded
    limit_req_status 429;
    
    # Custom error page for rate limiting
    error_page 429 /429.html;
    
    # Proxy pass to backend application
    proxy_pass http://backend;
    
    # Security headers for API responses
    add_header X-RateLimit-Limit "10r/s" always;
    add_header X-RateLimit-Remaining $limit_req_remaining always;
    
    # Security: Additional API-specific headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

# Rate limiting for hello endpoint specifically
location /hello {
    # Apply rate limiting with burst capacity
    limit_req zone=api_limit burst=20 nodelay;
    
    # Set status code for rate limit exceeded
    limit_req_status 429;
    
    # Custom error page for rate limiting
    error_page 429 /429.html;
    
    # Proxy pass to backend application
    proxy_pass http://backend;
    
    # Security headers for API responses
    add_header X-RateLimit-Limit "10r/s" always;
    add_header X-RateLimit-Remaining $limit_req_remaining always;
    
    # Performance: Disable access logging for this endpoint if needed
    # access_log off;
}

# Rate limit exceeded error page
location = /429.html {
    root /usr/share/nginx/html;
    internal;
    
    # Security: Headers for rate limit error page
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header Retry-After "60" always;
    
    # Security: Prevent indexing of error pages
    add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;
}

# -----------------------------------------------------------------------------
# HEALTH CHECK AND MONITORING ENDPOINTS
# -----------------------------------------------------------------------------
# Provides endpoints for health checks and monitoring without rate limiting

# Health check endpoint - no rate limiting for monitoring
location /health {
    access_log off;
    
    # Simple health check response
    return 200 "healthy\n";
    add_header Content-Type text/plain always;
    
    # Security: Basic headers for health check
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

# Status endpoint for monitoring
location /status {
    access_log off;
    
    # Return basic status information
    return 200 "OK\n";
    add_header Content-Type text/plain always;
    
    # Security: Basic headers for status check
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

# -----------------------------------------------------------------------------
# SECURITY HARDENING CONFIGURATIONS
# -----------------------------------------------------------------------------
# Additional security measures and access controls

# Deny access to hidden files and directories
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}

# Deny access to backup and temporary files
location ~* \.(bak|backup|swp|tmp|temp|log|ini|conf|config)$ {
    deny all;
    access_log off;
    log_not_found off;
}

# Deny access to version control directories
location ~ /\.(git|svn|hg|bzr) {
    deny all;
    access_log off;
    log_not_found off;
}

# Deny access to common sensitive files
location ~* ^/(wp-config|config|configuration|settings|local_settings|database|db_config)\.(php|inc|conf|config|txt)$ {
    deny all;
    access_log off;
    log_not_found off;
}

# Security: Block common attack patterns
location ~* (union.*select|concat.*\(|base64_decode|script.*alert|javascript:|vbscript:|data:) {
    deny all;
    access_log off;
    log_not_found off;
}

# -----------------------------------------------------------------------------
# PERFORMANCE OPTIMIZATION CONFIGURATIONS
# -----------------------------------------------------------------------------
# Additional performance optimizations and caching strategies

# Enable gzip compression for text-based content
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types
    application/atom+xml
    application/javascript
    application/json
    application/rss+xml
    application/vnd.ms-fontobject
    application/x-font-ttf
    application/x-web-app-manifest+json
    application/xhtml+xml
    application/xml
    font/opentype
    image/svg+xml
    image/x-icon
    text/css
    text/javascript
    text/plain
    text/x-component;

# Buffer sizes for performance optimization
proxy_buffer_size 4k;
proxy_buffers 8 4k;
proxy_busy_buffers_size 8k;

# Timeouts for performance and security
proxy_connect_timeout 5s;
proxy_send_timeout 10s;
proxy_read_timeout 10s;

# Client request limits for security
client_max_body_size 1m;
client_body_buffer_size 16k;
client_header_buffer_size 1k;
large_client_header_buffers 2 1k;

# -----------------------------------------------------------------------------
# LOGGING CONFIGURATION
# -----------------------------------------------------------------------------
# Enhanced logging for security monitoring and debugging

# Custom log format with additional security information
log_format security '$remote_addr - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" '
                   '$request_time $upstream_response_time '
                   '$gzip_ratio $request_length';

# Security-focused access log
access_log /var/log/nginx/security.log security;

# Error log with enhanced verbosity for security events
error_log /var/log/nginx/error.log warn;

# =============================================================================
# END OF CONFIGURATION
# =============================================================================
# This configuration file provides comprehensive security hardening,
# performance optimization, and modular functionality for the NGINX
# reverse proxy serving the Node.js/Express backend application.
# All directives are designed to be safely included in the main server block.
# =============================================================================