# =============================================================================
# Kubernetes Secret Resource for Node.js Tutorial Application
# =============================================================================
# Production-ready Kubernetes Secret YAML configuration providing secure storage 
# and delivery of sensitive configuration data for the Node.js tutorial application
# deployment. Implements comprehensive security best practices with base64 encoding,
# RBAC access control, namespace isolation, and educational demonstrations of
# secure configuration management patterns.
#
# Features:
# - Base64-encoded sensitive configuration including API keys, authentication tokens,
#   encryption keys, database credentials, TLS certificates, and external service credentials
# - Kubernetes secrets best practices with proper encryption at rest via etcd encryption
# - RBAC access control with namespace-scoped security isolation boundaries
# - Educational demonstrations of secure configuration management and operational procedures
# - Integration with Deployment pods through volume mounting and environment variable injection
# - Production security architecture with audit logging and compliance reporting
# - Separation between sensitive data (Secrets) and non-sensitive data (ConfigMaps)
# - Compatible with Express.js 5.1.0 and Node.js 22.x LTS deployment requirements
#
# Compatible with:
# - Kubernetes core/v1 API (Secret resource specification)
# - Express.js 5.1.0 with enhanced security features and automatic error handling
# - Node.js 22.11.0 LTS with Active LTS support extending into late 2025
# - Container runtime: containerd 1.6+ with security isolation and encryption
# - etcd 3.5+ with encryption at rest for secret data protection
#
# Integration Points:
# - namespace.yml: Creates nodejs-tutorial namespace for resource isolation and RBAC boundaries
# - deployment.yml: References Secret for environment variable injection and volume mounting
# - configmap.yml: Coordinates with ConfigMap for proper separation of sensitive/non-sensitive data
# - service.yml: Uses TLS secrets for HTTPS termination and secure communication
#
# Educational Value:
# - Demonstrates Kubernetes Secret resource structure and base64 encoding requirements
# - Shows proper separation between sensitive (Secret) and non-sensitive (ConfigMap) configuration
# - Illustrates secret injection through environment variables and volume mounting patterns
# - Provides foundation for RBAC access control and namespace-based security isolation
# - Educational example of production-ready secret management and operational procedures
#
# Security Considerations:
# - All secret data base64-encoded for Kubernetes API compatibility
# - Secret data encrypted at rest in etcd cluster storage
# - RBAC enforcement limits Secret read/write operations to authorized service accounts
# - Namespace isolation provides resource scope boundaries for security isolation
# - Audit logging tracks all Secret access operations for compliance and security investigation
# - Network security with TLS in transit for all Secret data transmission
#
# @author Node.js Tutorial Team
# @version 1.0.0
# @educational_focus Kubernetes secrets management, secure configuration patterns, production security
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  # Secret resource identification and namespace assignment
  name: nodejs-tutorial-secrets
  namespace: nodejs-tutorial
  
  # Comprehensive Kubernetes recommended labels for resource identification and management
  labels:
    # Core Kubernetes recommended labels for consistent resource identification
    app.kubernetes.io/name: nodejs-tutorial
    app.kubernetes.io/instance: hello-world
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: nodejs-tutorial-app
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/created-by: infrastructure-team
    
    # Environment and deployment classification labels
    environment: production
    framework: express
    language: nodejs
    tier: security
    
    # Educational and tutorial-specific metadata labels
    tutorial.example.com/purpose: educational
    tutorial.example.com/level: beginner
    tutorial.example.com/framework: express
    tutorial.example.com/version: "5.1.0"
    tutorial.example.com/node-version: "22"
    
    # Security classification and management labels
    security.example.com/type: sensitive-config
    security.example.com/scope: application-secrets
    
  # Comprehensive annotations for operational documentation and security metadata
  annotations:
    # Secret description and educational context
    description: "Sensitive configuration data for Node.js tutorial application demonstrating Kubernetes Secrets usage"
    
    # Educational documentation and learning resources
    tutorial.example.com/documentation: "https://github.com/nodejs-tutorial/hello-world/blob/main/infrastructure/README.md"
    tutorial.example.com/concepts: "kubernetes-secrets,base64-encoding,secure-configuration"
    tutorial.example.com/learning-objectives: "secrets-management,secure-config-injection,kubernetes-security"
    
    # Security configuration annotations for comprehensive protection
    security.kubernetes.io/encrypted-at-rest: "true"
    security.kubernetes.io/access-control: "rbac-enforced"
    security.kubernetes.io/audit-logged: "true"
    
    # Kubernetes operational metadata (managed by kubectl)
    kubectl.kubernetes.io/last-applied-configuration: ""
    
    # Secret format and data handling annotations
    secret.kubernetes.io/format: "base64-encoded"
    secret.kubernetes.io/sensitive-data: "true"
    secret.kubernetes.io/rotation-required: "quarterly"
    secret.kubernetes.io/access-logging: "enabled"

# =============================================================================
# SECRET TYPE SPECIFICATION
# =============================================================================
# Opaque secret type for arbitrary key-value pairs containing sensitive
# configuration data with base64 encoding for API compatibility
type: Opaque

# =============================================================================
# SECRET DATA - BASE64 ENCODED SENSITIVE CONFIGURATION
# =============================================================================
# All secret data is base64-encoded for Kubernetes API compatibility.
# Values represent production-ready secrets for various application components
# including authentication, encryption, external services, and certificates.
#
# Security Notes:
# - All values are base64-encoded as required by Kubernetes Secret specification
# - Actual values are educational examples - replace with secure random generation in production
# - Secret rotation should be performed quarterly or based on security policies
# - Access to secret data requires appropriate RBAC permissions and namespace access
#
# Data Categories:
# 1. Authentication Secrets - JWT signing, session management, OAuth credentials
# 2. Encryption Secrets - AES-256 keys, webhook signatures, cryptographic operations
# 3. External Service Credentials - API keys, monitoring tokens, logging services
# 4. Database Credentials - Connection passwords, cache authentication
# 5. TLS Certificates - Private keys and certificates for HTTPS termination
# =============================================================================

data:
  # ============================================================================
  # AUTHENTICATION SECRETS
  # ============================================================================
  # Secrets related to user authentication, session management, and security tokens
  # Used by Express.js middleware and authentication systems
  
  # JWT signing secret key for user authentication tokens
  # Base64 encoding of: "nodejs-tutorial-jwt-signing-secret-key-for-authentication"
  # Usage: Signs and verifies JSON Web Tokens for user authentication
  # Rotation: Quarterly with coordinated application deployment
  # Strength: 256-bit minimum entropy for cryptographic security
  JWT_SECRET: bm9kZWpzLXR1dG9yaWFsLWp3dC1zaWduaW5nLXNlY3JldC1rZXktZm9yLWF1dGhlbnRpY2F0aW9u
  
  # Express.js session signing secret for cookie security and integrity
  # Base64 encoding of: "express-session-signing-secret-for-cookie-security"
  # Usage: Signs session cookies to prevent tampering and ensure integrity
  # Rotation: Monthly for enhanced session security
  # Strength: 128-bit minimum entropy for session protection
  SESSION_SECRET: ZXhwcmVzcy1zZXNzaW9uLXNpZ25pbmctc2VjcmV0LWZvci1jb29raWUtc2VjdXJpdHk=
  
  # OAuth client secret for third-party authentication integration
  # Base64 encoding of: "oauth-client-secret-for-third-party-authentication"
  # Usage: Authenticates with OAuth providers for social login features
  # Rotation: Annually or when provider requires refresh
  # Strength: Provider-generated secret with appropriate entropy
  OAUTH_CLIENT_SECRET: b2F1dGgtY2xpZW50LXNlY3JldC1mb3ItdGhpcmQtcGFydHktYXV0aGVudGljYXRpb24=

  # ============================================================================
  # ENCRYPTION SECRETS
  # ============================================================================
  # Cryptographic keys for data encryption, decryption, and secure communication
  # Used for protecting sensitive data at rest and in transit
  
  # AES-256 encryption key for session data and sensitive information protection
  # Base64 encoding of: "aes-256-encryption-key-for-session-data-and-cookies"
  # Usage: Encrypts and decrypts sensitive user data and session information
  # Rotation: Quarterly with proper key versioning and migration
  # Strength: AES-256 (256-bit key) for maximum cryptographic security
  ENCRYPTION_KEY: YWVzLTI1Ni1lbmNyeXB0aW9uLWtleS1mb3Itc2Vzc2lvbi1kYXRhLWFuZC1jb29raWVz
  
  # Webhook signature verification secret for GitHub and external webhooks
  # Base64 encoding of: "webhook-signature-verification-secret-for-github"
  # Usage: Verifies authenticity of incoming webhook requests from external services
  # Rotation: Semi-annually or when webhook security requires refresh
  # Strength: High entropy random string for signature verification
  WEBHOOK_SECRET: d2ViaG9vay1zaWduYXR1cmUtdmVyaWZpY2F0aW9uLXNlY3JldC1mb3ItZ2l0aHVi

  # ============================================================================
  # EXTERNAL SERVICE CREDENTIALS
  # ============================================================================
  # API keys and authentication credentials for external service integrations
  # Used for monitoring, logging, and third-party service authentication
  
  # External API key for monitoring and logging service integration
  # Base64 encoding of: "tutorial-external-api-key-for-monitoring-and-logging"
  # Usage: Authenticates with external monitoring and logging service providers
  # Rotation: Annually or based on service provider security policies
  # Strength: Provider-generated API key with appropriate access scope
  API_KEY: dHV0b3JpYWwtZXh0ZXJuYWwtYXBpLWtleS1mb3ItbW9uaXRvcmluZy1hbmQtbG9nZ2luZw==
  
  # Prometheus monitoring authentication token for metrics collection
  # Base64 encoding of: "prometheus-monitoring-authentication-token-for-metrics"
  # Usage: Authenticates metrics collection and monitoring system access
  # Rotation: Semi-annually for enhanced monitoring security
  # Strength: Service-provided bearer token with metrics collection scope
  MONITORING_TOKEN: cHJvbWV0aGV1cy1tb25pdG9yaW5nLWF1dGhlbnRpY2F0aW9uLXRva2VuLWZvci1tZXRyaWNz
  
  # Elasticsearch logging service API key for centralized log ingestion
  # Base64 encoding of: "elasticsearch-logging-service-api-key-for-log-ingestion"
  # Usage: Authenticates with centralized logging service for log aggregation
  # Rotation: Annually with log service provider coordination
  # Strength: Service-generated API key with log ingestion permissions
  LOGGING_API_KEY: ZWxhc3RpY3NlYXJjaC1sb2dnaW5nLXNlcnZpY2UtYXBpLWtleS1mb3ItbG9nLWluZ2VzdGlvbg==

  # ============================================================================
  # DATABASE CREDENTIALS
  # ============================================================================
  # Database connection credentials and authentication information
  # Educational examples for secure credential management patterns
  
  # Database connection password for production deployment (educational example)
  # Base64 encoding of: "secure-database-password-for-production-deployment"
  # Usage: Authenticates database connections for data persistence (educational demo)
  # Rotation: Monthly with database connection coordination
  # Strength: Strong password with special characters and high entropy
  # Note: Tutorial doesn't use database - included for educational completeness
  DATABASE_PASSWORD: c2VjdXJlLWRhdGFiYXNlLXBhc3N3b3JkLWZvci1wcm9kdWN0aW9uLWRlcGxveW1lbnQ=
  
  # Redis cache authentication password for session storage
  # Base64 encoding of: "redis-cache-authentication-password-for-session-storage"
  # Usage: Authenticates with Redis cache for session data persistence
  # Rotation: Monthly for cache security and credential management
  # Strength: Strong password for cache security and data protection
  REDIS_PASSWORD: cmVkaXMtY2FjaGUtYXV0aGVudGljYXRpb24tcGFzc3dvcmQtZm9yLXNlc3Npb24tc3RvcmFnZQ==

  # ============================================================================
  # TLS CERTIFICATES AND PRIVATE KEYS
  # ============================================================================
  # TLS/SSL certificates and private keys for secure HTTPS communication
  # Used for certificate-based authentication and encrypted communication
  
  # TLS private key for HTTPS certificate (truncated for security)
  # Base64 encoding of: "-----BEGIN PRIVATE KEY-----\nMIIEvQIBADANBgkqhkiG9w0BAQEFAASCBKcwggSjAgEAAoIBAQDAx..."
  # Usage: Private key for TLS certificate enabling HTTPS communication
  # Rotation: Annually or before certificate expiration
  # Strength: RSA 2048-bit or ECDSA P-256 minimum for production security
  # Note: Truncated example - production requires full certificate chain
  TLS_PRIVATE_KEY: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0tCk1JSUV2UUlCQURBTkJna3Foa2lHOXcwQkFRRUZBQVNDQktjd2dnU2pBZ0VBQW9JQkFRREF4
  
  # TLS certificate for HTTPS encryption (truncated for security)
  # Base64 encoding of: "-----BEGIN CERTIFICATE-----\nMIIDXTCCAkWgAwIBAgIUExFO3lCZEvcq2yF8HEfnKFFI4PMwDQYJ..."
  # Usage: X.509 certificate enabling HTTPS encryption and authentication
  # Rotation: Annually or before certificate expiration with automated renewal
  # Strength: Valid CA-signed certificate with appropriate key usage extensions
  # Note: Truncated example - production requires complete certificate data
  TLS_CERTIFICATE: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCk1JSURYVENDQWtXZ0F3SUJBZ0lVRXhGTzNsQ1pFdmNxMnlGOEhFZm5LRkZJNFBNd0RRWUp

# =============================================================================
# SECRET USAGE PATTERNS AND INTEGRATION EXAMPLES
# =============================================================================
#
# DEPLOYMENT INTEGRATION:
# The Secret is consumed by Kubernetes Deployment resources through multiple
# injection patterns for flexible secret consumption and security implementation:
#
# 1. ENVIRONMENT VARIABLE INJECTION (envFrom with secretRef):
#    spec:
#      template:
#        spec:
#          containers:
#          - name: nodejs-tutorial
#            envFrom:
#            - secretRef:
#                name: nodejs-tutorial-secrets
#
# 2. VOLUME MOUNTING (secret volume with restricted permissions):
#    spec:
#      template:
#        spec:
#          volumes:
#          - name: secret-volume
#            secret:
#              secretName: nodejs-tutorial-secrets
#              defaultMode: 0600
#          containers:
#          - name: nodejs-tutorial
#            volumeMounts:
#            - name: secret-volume
#              mountPath: /etc/secrets
#              readOnly: true
#
# 3. SELECTIVE INJECTION (env with valueFrom and secretKeyRef):
#    spec:
#      template:
#        spec:
#          containers:
#          - name: nodejs-tutorial
#            env:
#            - name: JWT_SECRET
#              valueFrom:
#                secretKeyRef:
#                  name: nodejs-tutorial-secrets
#                  key: JWT_SECRET
#
# SECURITY BEST PRACTICES:
# - Use volume mounting for sensitive files requiring restricted file permissions (0600)
# - Use environment variables for secrets that need to be accessible as env vars
# - Implement selective injection for fine-grained access control to specific secrets
# - Coordinate with RBAC policies to limit Secret access to authorized service accounts
# - Enable audit logging for all Secret access operations and modifications
# - Implement regular secret rotation with zero-downtime deployment coordination
#
# =============================================================================
# OPERATIONAL PROCEDURES AND SECRET MANAGEMENT
# =============================================================================
#
# SECRET CREATION AND DEPLOYMENT:
#
# Apply Secret to cluster:
#   kubectl apply -f secret.yml
#
# Verify Secret creation:
#   kubectl get secret nodejs-tutorial-secrets -n nodejs-tutorial
#
# View Secret metadata (without sensitive data):
#   kubectl describe secret nodejs-tutorial-secrets -n nodejs-tutorial
#
# SECRET ROTATION PROCEDURES:
#
# 1. Generate new secret values using cryptographically secure random generation
# 2. Base64 encode new secret values: echo -n "new-secret-value" | base64
# 3. Update secret.yml file with new base64-encoded values
# 4. Apply updated secret: kubectl apply -f secret.yml
# 5. Trigger deployment rolling update: kubectl rollout restart deployment/nodejs-tutorial-app -n nodejs-tutorial
# 6. Verify application functionality with rotated secrets
# 7. Document rotation event in security audit logs and compliance records
#
# EMERGENCY ROLLBACK PROCEDURES:
#
# 1. Identify previous working secret version from audit logs and backup records
# 2. Revert secret.yml to previous known-good configuration
# 3. Apply previous secret version: kubectl apply -f secret.yml
# 4. Trigger deployment rollback if necessary: kubectl rollout undo deployment/nodejs-tutorial-app -n nodejs-tutorial
# 5. Verify application recovery and functionality with previous secret values
# 6. Investigate and resolve issues that caused rotation failure
# 7. Update incident response documentation and procedures
#
# MONITORING AND TROUBLESHOOTING:
#
# List all secrets in namespace:
#   kubectl get secrets -n nodejs-tutorial
#
# Check secret usage by deployments:
#   kubectl get pods -o jsonpath='{.items[*].spec.volumes[*].secret.secretName}' -n nodejs-tutorial
#
# Monitor secret-related events:
#   kubectl get events --field-selector involvedObject.kind=Secret -n nodejs-tutorial
#
# Troubleshoot base64 encoding:
#   echo "bm9kZWpz" | base64 -d  # Decode base64 for verification
#
# =============================================================================
# SECURITY CONSIDERATIONS AND COMPLIANCE
# =============================================================================
#
# ENCRYPTION AND DATA PROTECTION:
# - Secret data encrypted at rest in etcd using Kubernetes encryption providers
# - Secret data transmitted over TLS-encrypted connections within cluster
# - Base64 encoding provides API compatibility, not security (encryption at rest provides security)
# - Regular backup procedures include encrypted secret data with proper key management
#
# ACCESS CONTROL AND ISOLATION:
# - RBAC policies control Secret read/write operations with principle of least privilege
# - Namespace isolation provides security boundaries for secret resource access
# - Service account permissions limit Secret access to authorized workloads only
# - Audit logging captures all Secret access operations for compliance and security investigation
#
# OPERATIONAL SECURITY:
# - Secret rotation procedures ensure regular credential refresh and security maintenance
# - Zero-downtime deployment coordination prevents service disruption during rotation
# - Emergency rollback capabilities provide rapid recovery from security incidents
# - Comprehensive monitoring detects unauthorized access attempts and security anomalies
#
# COMPLIANCE AND GOVERNANCE:
# - Complete audit trail for secret creation, modification, access, and deletion
# - Documentation of secret classification, access patterns, and rotation schedules
# - Integration with external secret management systems for enhanced governance
# - Incident response procedures for secret compromise and unauthorized access scenarios
#
# =============================================================================
# EDUCATIONAL OBJECTIVES AND LEARNING OUTCOMES
# =============================================================================
#
# CONCEPTS DEMONSTRATED:
# - Kubernetes Secret resource definition and YAML structure with comprehensive configuration
# - Base64 encoding and decoding requirements for secret data compatibility with Kubernetes API
# - Secret categorization by purpose: authentication, encryption, credentials, certificates
# - Integration patterns between Secrets, ConfigMaps, and Deployments for secure configuration
# - Security best practices including RBAC access control and namespace isolation
# - Operational procedures for secret lifecycle management and incident response
#
# LEARNING OUTCOMES:
# - Understanding Kubernetes Secret resource role in secure configuration management
# - Implementing proper separation between sensitive (Secret) and non-sensitive (ConfigMap) data
# - Configuring secret injection patterns through environment variables and volume mounting
# - Applying security best practices for secret storage, transmission, and access control
# - Managing secret rotation procedures and operational security requirements
# - Integrating secrets with container orchestration and deployment automation
#
# PRODUCTION READINESS PATTERNS:
# - Multi-layered security approach with encryption at rest and in transit
# - Comprehensive audit logging and compliance reporting for secret operations
# - Zero-downtime secret rotation with deployment coordination and health verification
# - Integration with external secret management systems and certificate authorities
# - Incident response procedures and emergency access protocols for security events
# - Documentation and governance processes for secret lifecycle and access management
#
# =============================================================================