# =============================================================================
# Node.js Tutorial Application - Docker CI/CD Workflow
# =============================================================================
# GitHub Actions workflow for comprehensive Docker image building, multi-platform deployment,
# security scanning, and container registry management. Implements production-ready Docker CI/CD
# pipeline with multi-stage builds, security hardening, image optimization, and educational
# best practices for learning Docker containerization with Node.js and Express.js applications.
#
# Pipeline Architecture:
# - Phase 1: Docker metadata extraction and build context preparation
# - Phase 2: Development image build with debugging tools and comprehensive testing
# - Phase 3: Production image build with security hardening and multi-platform support
# - Phase 4: Container security scanning with Trivy vulnerability assessment
# - Phase 5: Container registry management with GitHub Container Registry integration
# - Phase 6: Educational materials generation and comprehensive workflow reporting
#
# Educational Features:
# - Multi-stage build optimization demonstrating development vs production strategies
# - Container security integration with vulnerability scanning and compliance validation
# - Multi-platform Docker builds for AMD64 and ARM64 architectures
# - GitHub Container Registry integration with automated authentication and publishing
# - Comprehensive logging and educational documentation for Docker learning objectives
# - Quality gate enforcement with vulnerability thresholds and deployment decision logic
#
# Security Implementation:
# - Container vulnerability scanning with Trivy integration and SARIF reporting
# - Security gate enforcement with configurable vulnerability thresholds
# - Non-root container execution with uid 1000 for enhanced security
# - Base image security with official Node.js Alpine images and regular updates
# - Build provenance and SBOM generation for supply chain security compliance

name: 'Docker Build and Registry Management'

# =============================================================================
# WORKFLOW TRIGGER CONFIGURATION
# =============================================================================
on:
  # Trigger Docker builds on push to main development branches and Docker-related changes
  push:
    branches:
      - main
      - develop
      - 'docker/*'
    paths:
      - 'src/backend/Dockerfile'
      - 'src/backend/**'
      - '.github/workflows/docker.yml'
      - '.dockerignore'
    # Exclude documentation changes from triggering Docker builds
    paths-ignore:
      - '**.md'
      - 'docs/**'

  # Trigger Docker build validation on pull requests with Docker-related changes
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src/backend/Dockerfile'
      - 'src/backend/**'
      - '.github/workflows/docker.yml'
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  # Trigger production Docker builds and multi-platform publishing on release events
  release:
    types:
      - published
      - created

  # Manual Docker workflow trigger with customizable build parameters
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Docker build target stage'
        required: false
        default: 'production'
        type: choice
        options:
          - 'development'
          - 'production'
          - 'both'
      platforms:
        description: 'Target platforms for multi-platform build'
        required: false
        default: 'linux/amd64,linux/arm64'
        type: string
      push_to_registry:
        description: 'Push built images to container registry'
        required: false
        default: 'true'
        type: boolean
      skip_security_scan:
        description: 'Skip container security scanning'
        required: false
        default: 'false'
        type: boolean
      cache_mode:
        description: 'Docker build cache mode'
        required: false
        default: 'max'
        type: choice
        options:
          - 'min'
          - 'max'
          - 'disabled'

# Prevent concurrent Docker builds on the same branch to avoid registry conflicts
concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

# Minimal required permissions for package registry publishing and security scanning
permissions:
  contents: read                # Read repository content for checkout and build context access
  packages: write               # Container registry publishing for GitHub Container Registry
  security-events: write       # Security scanning result publishing to GitHub Security tab
  id-token: write               # OIDC token for secure authentication with registries
  actions: read                 # Action execution and artifact management access

# =============================================================================
# GLOBAL ENVIRONMENT VARIABLES
# =============================================================================
env:
  REGISTRY: ghcr.io
  REGISTRY_NAMESPACE: ${{ github.repository_owner }}
  IMAGE_NAME: ${{ github.repository }}/nodejs-hello-tutorial
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  BUILDX_NO_DEFAULT_ATTESTATIONS: 1

# =============================================================================
# WORKFLOW JOBS - DOCKER CI/CD PIPELINE ORCHESTRATION
# =============================================================================
jobs:
  # ===========================================================================
  # JOB 1: Docker Metadata Extraction and Build Context Preparation
  # ===========================================================================
  docker_metadata_extraction:
    name: 'Extract Docker Metadata'
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    outputs:
      image_name: ${{ steps.meta.outputs.image_name }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      build_args: ${{ steps.build_args.outputs.args }}
      should_push: ${{ steps.push_decision.outputs.should_push }}
      cache_key: ${{ steps.cache_key.outputs.key }}

    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4 # v4.1.7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Extract Package Metadata'
        id: package_info
        working-directory: src/backend
        run: |
          echo 'Extracting package.json metadata for Docker image configuration'
          APP_NAME=$(jq -r '.name' package.json)
          APP_VERSION=$(jq -r '.version' package.json)
          NODE_VERSION=$(jq -r '.engines.node' package.json | sed 's/>=//g' | cut -d'.' -f1)
          
          echo "app_name=${APP_NAME}" >> $GITHUB_OUTPUT
          echo "app_version=${APP_VERSION}" >> $GITHUB_OUTPUT
          echo "node_version=${NODE_VERSION}" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: 'Generate Docker Metadata'
        id: meta
        uses: docker/metadata-action@v5 # v5.5.1
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=${{ steps.package_info.outputs.app_name }}
            org.opencontainers.image.description=Node.js tutorial application with Express.js 5.1.0
            org.opencontainers.image.vendor=Node.js Tutorial Team
            org.opencontainers.image.version=${{ steps.package_info.outputs.app_version }}
            org.opencontainers.image.created=${{ steps.package_info.outputs.build_date }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            tutorial.nodejs.version=${{ steps.package_info.outputs.node_version }}
            tutorial.express.version=5.1.0
            tutorial.build.workflow=${{ github.workflow }}
            tutorial.educational=true

      - name: 'Generate Build Arguments'
        id: build_args
        run: |
          echo 'Generating Docker build arguments for multi-stage builds'
          BUILD_ARGS=""
          BUILD_ARGS="${BUILD_ARGS} NODE_VERSION=${{ steps.package_info.outputs.node_version }}"
          BUILD_ARGS="${BUILD_ARGS} APP_VERSION=${{ steps.package_info.outputs.app_version }}"
          BUILD_ARGS="${BUILD_ARGS} BUILD_DATE=${{ steps.package_info.outputs.build_date }}"
          BUILD_ARGS="${BUILD_ARGS} VCS_REF=${{ github.sha }}"
          BUILD_ARGS="${BUILD_ARGS} GITHUB_REPOSITORY=${{ github.repository }}"
          
          echo "args=${BUILD_ARGS}" >> $GITHUB_OUTPUT
          echo "Build arguments: ${BUILD_ARGS}"

      - name: 'Determine Push Strategy'
        id: push_decision
        run: |
          SHOULD_PUSH="false"
          
          # Push on main branch pushes
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            SHOULD_PUSH="true"
          fi
          
          # Push on release events
          if [[ "${{ github.event_name }}" == "release" ]]; then
            SHOULD_PUSH="true"
          fi
          
          # Manual workflow dispatch decision
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.push_to_registry }}" == "true" ]]; then
            SHOULD_PUSH="true"
          fi
          
          echo "should_push=${SHOULD_PUSH}" >> $GITHUB_OUTPUT
          echo "Push decision: ${SHOULD_PUSH}"

      - name: 'Generate Cache Key'
        id: cache_key
        run: |
          CACHE_KEY="docker-buildx-${{ github.repository }}-"
          CACHE_KEY="${CACHE_KEY}$(echo '${{ hashFiles('src/backend/package*.json', 'src/backend/Dockerfile', 'src/backend/.dockerignore') }}' | head -c 8)"
          echo "key=${CACHE_KEY}" >> $GITHUB_OUTPUT
          echo "Cache key: ${CACHE_KEY}"

  # ===========================================================================
  # JOB 2: Development Docker Image Build with Debugging Tools
  # ===========================================================================
  docker_build_development:
    name: 'Build Development Docker Image'
    runs-on: ubuntu-22.04
    needs: [docker_metadata_extraction]
    timeout-minutes: 30
    if: "${{ inputs.build_target == 'development' || inputs.build_target == 'both' || (inputs.build_target != 'production' && github.event_name == 'pull_request') }}"

    outputs:
      image_id: ${{ steps.build.outputs.imageid }}
      image_digest: ${{ steps.build.outputs.digest }}
      image_size: ${{ steps.image_info.outputs.size }}
      build_duration: ${{ steps.build.outputs.duration }}

    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4

      - name: 'Set up Docker Buildx'
        uses: docker/setup-buildx-action@v3 # v3.7.1
        with:
          version: 'v0.12.0'
          driver-opts: network=host
          buildkitd-flags: --allow-insecure-entitlement security.insecure --allow-insecure-entitlement network.host

      - name: 'Login to Container Registry'
        uses: docker/login-action@v3 # v3.3.0
        if: "needs.docker_metadata_extraction.outputs.should_push == 'true'"
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Build Development Image'
        id: build
        uses: docker/build-push-action@v5 # v5.4.0
        with:
          context: src/backend
          file: src/backend/Dockerfile
          target: build
          platforms: "${{ github.event_name == 'release' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}"
          push: ${{ needs.docker_metadata_extraction.outputs.should_push }}
          tags: ${{ needs.docker_metadata_extraction.outputs.tags }}-dev
          labels: ${{ needs.docker_metadata_extraction.outputs.labels }}
          build-args: ${{ needs.docker_metadata_extraction.outputs.build_args }}
          cache-from: type=gha,scope=${{ needs.docker_metadata_extraction.outputs.cache_key }}-dev
          cache-to: "type=gha,mode=${{ inputs.cache_mode || 'max' }},scope=${{ needs.docker_metadata_extraction.outputs.cache_key }}-dev"
          provenance: false
          sbom: true

      - name: 'Extract Image Information'
        id: image_info
        if: "steps.build.conclusion == 'success'"
        run: |
          echo 'Extracting development image information'
          IMAGE_TAG="${{ needs.docker_metadata_extraction.outputs.tags }}-dev" | head -n1
          if docker image inspect "${IMAGE_TAG}" > /dev/null 2>&1; then
            IMAGE_SIZE=$(docker image inspect "${IMAGE_TAG}" --format='{{.Size}}' | numfmt --to=iec)
            echo "size=${IMAGE_SIZE}" >> $GITHUB_OUTPUT
            echo "Development image size: ${IMAGE_SIZE}"
          else
            echo "size=unknown" >> $GITHUB_OUTPUT
            echo "Could not determine image size (multi-platform build)"
          fi

      - name: 'Test Development Image Functionality'
        if: "steps.build.conclusion == 'success' && github.event_name != 'release'"
        run: |
          echo 'Testing development image functionality'
          IMAGE_TAG=$(echo '${{ needs.docker_metadata_extraction.outputs.tags }}' | head -n1)-dev
          
          if docker image inspect "${IMAGE_TAG}" > /dev/null 2>&1; then
            echo "Starting development container for testing"
            CONTAINER_ID=$(docker run -d --name dev-test -p 3001:3000 "${IMAGE_TAG}")
            echo "Container ID: ${CONTAINER_ID}"
            
            # Wait for application startup
            sleep 10
            
            # Test health endpoint
            if curl -f -s http://localhost:3001/health > /dev/null; then
              echo '✅ Development image health check passed'
            else
              echo '❌ Development image health check failed'
              docker logs dev-test
              exit 1
            fi
            
            # Test hello endpoint
            RESPONSE=$(curl -s http://localhost:3001/hello)
            if [[ "$RESPONSE" == "Hello world" ]]; then
              echo '✅ Development image hello endpoint test passed'
            else
              echo '❌ Development image hello endpoint test failed'
              echo "Expected: Hello world, Got: $RESPONSE"
              exit 1
            fi
            
            # Cleanup
            docker stop dev-test
            docker rm dev-test
          else
            echo "ℹ️ Skipping functionality test for multi-platform build"
          fi

  # ===========================================================================
  # JOB 3: Production Docker Image Build with Security Hardening
  # ===========================================================================
  docker_build_production:
    name: 'Build Production Docker Image'
    runs-on: ubuntu-22.04
    needs: [docker_metadata_extraction]
    timeout-minutes: 25
    if: "${{ inputs.build_target == 'production' || inputs.build_target == 'both' || inputs.build_target == '' }}"

    outputs:
      image_id: ${{ steps.build.outputs.imageid }}
      image_digest: ${{ steps.build.outputs.digest }}
      image_size: ${{ steps.image_info.outputs.size }}
      build_duration: ${{ steps.build.outputs.duration }}
      security_scan_required: ${{ steps.security_decision.outputs.scan_required }}

    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4

      - name: 'Set up Docker Buildx'
        uses: docker/setup-buildx-action@v3
        with:
          version: 'v0.12.0'
          driver-opts: network=host
          buildkitd-flags: --allow-insecure-entitlement security.insecure --allow-insecure-entitlement network.host

      - name: 'Login to Container Registry'
        uses: docker/login-action@v3
        if: "needs.docker_metadata_extraction.outputs.should_push == 'true'"
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Build Production Image'
        id: build
        uses: docker/build-push-action@v5
        with:
          context: src/backend
          file: src/backend/Dockerfile
          target: production
          platforms: "${{ inputs.platforms || (github.event_name == 'release' && 'linux/amd64,linux/arm64' || 'linux/amd64') }}"
          push: ${{ needs.docker_metadata_extraction.outputs.should_push }}
          tags: ${{ needs.docker_metadata_extraction.outputs.tags }}
          labels: ${{ needs.docker_metadata_extraction.outputs.labels }}
          build-args: ${{ needs.docker_metadata_extraction.outputs.build_args }}
          cache-from: type=gha,scope=${{ needs.docker_metadata_extraction.outputs.cache_key }}-prod
          cache-to: "type=gha,mode=${{ inputs.cache_mode || 'max' }},scope=${{ needs.docker_metadata_extraction.outputs.cache_key }}-prod"
          provenance: false
          sbom: true
          attestations: type=provenance,mode=max

      - name: 'Extract Production Image Information'
        id: image_info
        if: "steps.build.conclusion == 'success'"
        run: |
          echo 'Extracting production image information'
          IMAGE_TAG=$(echo '${{ needs.docker_metadata_extraction.outputs.tags }}' | head -n1)
          
          if docker image inspect "${IMAGE_TAG}" > /dev/null 2>&1; then
            IMAGE_SIZE=$(docker image inspect "${IMAGE_TAG}" --format='{{.Size}}' | numfmt --to=iec)
            LAYER_COUNT=$(docker image inspect "${IMAGE_TAG}" --format='{{len .RootFS.Layers}}')
            echo "size=${IMAGE_SIZE}" >> $GITHUB_OUTPUT
            echo "layers=${LAYER_COUNT}" >> $GITHUB_OUTPUT
            echo "Production image size: ${IMAGE_SIZE} (${LAYER_COUNT} layers)"
          else
            echo "size=unknown" >> $GITHUB_OUTPUT
            echo "layers=unknown" >> $GITHUB_OUTPUT
            echo "Could not determine image size (multi-platform build)"
          fi

      - name: 'Test Production Image Functionality'
        if: "steps.build.conclusion == 'success' && github.event_name != 'release'"
        run: |
          echo 'Testing production image functionality and performance'
          IMAGE_TAG=$(echo '${{ needs.docker_metadata_extraction.outputs.tags }}' | head -n1)
          
          if docker image inspect "${IMAGE_TAG}" > /dev/null 2>&1; then
            echo "Starting production container for testing"
            CONTAINER_ID=$(docker run -d --name prod-test -p 3002:3000 "${IMAGE_TAG}")
            echo "Container ID: ${CONTAINER_ID}"
            
            # Wait for application startup
            sleep 8
            
            # Test health endpoint with timing
            HEALTH_TIME=$(time curl -f -s http://localhost:3002/health > /dev/null)
            if [ $? -eq 0 ]; then
              echo '✅ Production image health check passed'
            else
              echo '❌ Production image health check failed'
              docker logs prod-test
              exit 1
            fi
            
            # Test hello endpoint with response validation
            RESPONSE=$(curl -s http://localhost:3002/hello)
            if [[ "$RESPONSE" == "Hello world" ]]; then
              echo '✅ Production image hello endpoint test passed'
            else
              echo '❌ Production image hello endpoint test failed'
              echo "Expected: Hello world, Got: $RESPONSE"
              exit 1
            fi
            
            # Performance and resource usage check
            MEMORY_USAGE=$(docker stats --no-stream --format 'table {{.MemUsage}}' prod-test | tail -n1 | awk '{print $1}')
            CPU_USAGE=$(docker stats --no-stream --format 'table {{.CPUPerc}}' prod-test | tail -n1)
            echo "Memory usage: ${MEMORY_USAGE}, CPU usage: ${CPU_USAGE}"
            
            # Cleanup
            docker stop prod-test
            docker rm prod-test
          else
            echo "ℹ️ Skipping functionality test for multi-platform build"
          fi

      - name: 'Determine Security Scan Requirements'
        id: security_decision
        run: |
          SCAN_REQUIRED="true"
          
          # Skip security scan if explicitly disabled
          if [[ "${{ inputs.skip_security_scan }}" == "true" ]]; then
            SCAN_REQUIRED="false"
          fi
          
          # Skip for multi-platform release builds to avoid timeout
          if [[ "${{ github.event_name }}" == "release" && "${{ inputs.platforms }}" == *"linux/arm64"* ]]; then
            SCAN_REQUIRED="false"
          fi
          
          echo "scan_required=${SCAN_REQUIRED}" >> $GITHUB_OUTPUT
          echo "Security scan required: ${SCAN_REQUIRED}"

  # ===========================================================================
  # JOB 4: Container Security Scanning with Trivy
  # ===========================================================================
  docker_security_scan:
    name: 'Container Security Scanning'
    runs-on: ubuntu-22.04
    needs: [docker_metadata_extraction, docker_build_production]
    timeout-minutes: 20
    if: "${{ needs.docker_build_production.outputs.security_scan_required == 'true' && always() && !cancelled() }}"

    outputs:
      scan_result: ${{ steps.trivy_scan.outcome }}
      vulnerability_count: ${{ steps.vulnerability_summary.outputs.total_vulnerabilities }}
      critical_count: ${{ steps.vulnerability_summary.outputs.critical_vulnerabilities }}
      security_report_path: ${{ steps.security_report.outputs.report_path }}

    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4

      - name: 'Set up Docker Buildx'
        uses: docker/setup-buildx-action@v3

      - name: 'Login to Container Registry'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Pull Production Image for Scanning'
        run: |
          IMAGE_TAG=$(echo '${{ needs.docker_metadata_extraction.outputs.tags }}' | head -n1)
          echo "Pulling image for security scanning: ${IMAGE_TAG}"
          docker pull "${IMAGE_TAG}" || echo "Image not available for pulling (local build)"
          docker images | grep nodejs-hello-tutorial || echo "No tutorial images found"

      - name: 'Run Trivy Container Security Scan'
        id: trivy_scan
        uses: aquasecurity/trivy-action@master # v0.28.0
        with:
          image-ref: '${{ needs.docker_metadata_extraction.outputs.tags }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '1'
          ignore-unfixed: 'true'
          vuln-type: 'os,library'
          scanners: 'vuln,secret,config'
        continue-on-error: true

      - name: 'Generate Additional Security Reports'
        id: security_report
        run: |
          echo 'Generating comprehensive security reports'
          mkdir -p security-reports
          
          # Generate JSON report for analysis
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v $(pwd)/security-reports:/output \
            aquasec/trivy:latest image \
            --format json \
            --output /output/trivy-detailed.json \
            '${{ needs.docker_metadata_extraction.outputs.tags }}' || true
          
          # Generate HTML report for educational purposes
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v $(pwd)/security-reports:/output \
            aquasec/trivy:latest image \
            --format template \
            --template '@contrib/html.tpl' \
            --output /output/trivy-report.html \
            '${{ needs.docker_metadata_extraction.outputs.tags }}' || true
          
          echo "report_path=security-reports/" >> $GITHUB_OUTPUT

      - name: 'Extract Vulnerability Summary'
        id: vulnerability_summary
        run: |
          echo 'Extracting vulnerability summary from scan results'
          
          if [ -f 'security-reports/trivy-detailed.json' ]; then
            TOTAL_VULNS=$(jq '[.Results[]? | select(.Vulnerabilities) | .Vulnerabilities | length] | add // 0' security-reports/trivy-detailed.json)
            CRITICAL_VULNS=$(jq '[.Results[]? | select(.Vulnerabilities) | .Vulnerabilities[] | select(.Severity == "CRITICAL")] | length' security-reports/trivy-detailed.json)
            HIGH_VULNS=$(jq '[.Results[]? | select(.Vulnerabilities) | .Vulnerabilities[] | select(.Severity == "HIGH")] | length' security-reports/trivy-detailed.json)
            MEDIUM_VULNS=$(jq '[.Results[]? | select(.Vulnerabilities) | .Vulnerabilities[] | select(.Severity == "MEDIUM")] | length' security-reports/trivy-detailed.json)
          else
            TOTAL_VULNS=0
            CRITICAL_VULNS=0
            HIGH_VULNS=0
            MEDIUM_VULNS=0
          fi
          
          echo "total_vulnerabilities=${TOTAL_VULNS}" >> $GITHUB_OUTPUT
          echo "critical_vulnerabilities=${CRITICAL_VULNS}" >> $GITHUB_OUTPUT
          echo "high_vulnerabilities=${HIGH_VULNS}" >> $GITHUB_OUTPUT
          echo "medium_vulnerabilities=${MEDIUM_VULNS}" >> $GITHUB_OUTPUT
          
          echo "Security Scan Summary:"
          echo "  Total vulnerabilities: ${TOTAL_VULNS}"
          echo "  Critical: ${CRITICAL_VULNS}"
          echo "  High: ${HIGH_VULNS}"
          echo "  Medium: ${MEDIUM_VULNS}"

      - name: 'Upload Security Scan SARIF Results'
        uses: github/codeql-action/upload-sarif@v3 # v3.27.9
        if: "always() && steps.trivy_scan.conclusion != 'skipped'"
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'container-security'

      - name: 'Upload Security Reports'
        uses: actions/upload-artifact@v4 # v4.4.3
        if: 'always()'
        with:
          name: 'docker-security-reports'
          path: 'security-reports/'
          retention-days: 30

      - name: 'Security Gate Validation'
        run: |
          echo 'Validating security gate thresholds'
          CRITICAL_COUNT=${{ steps.vulnerability_summary.outputs.critical_vulnerabilities }}
          HIGH_COUNT=${{ steps.vulnerability_summary.outputs.high_vulnerabilities }}
          
          echo "Critical vulnerabilities: ${CRITICAL_COUNT} (threshold: 0)"
          echo "High vulnerabilities: ${HIGH_COUNT} (threshold: 5)"
          
          if [ "${CRITICAL_COUNT}" -gt 0 ]; then
            echo "❌ CRITICAL: ${CRITICAL_COUNT} critical vulnerabilities detected!"
            echo "Security gate failed - critical vulnerabilities must be resolved"
            exit 1
          fi
          
          if [ "${HIGH_COUNT}" -gt 5 ]; then
            echo "⚠️ WARNING: ${HIGH_COUNT} high vulnerabilities detected (threshold: 5)"
            echo "Consider addressing high-severity vulnerabilities"
          fi
          
          echo "✅ Security gate validation passed"

  # ===========================================================================
  # JOB 5: Container Registry Management and Verification
  # ===========================================================================
  docker_registry_management:
    name: 'Container Registry Management'
    runs-on: ubuntu-22.04
    needs: [docker_metadata_extraction, docker_build_production, docker_security_scan]
    timeout-minutes: 15
    if: "${{ needs.docker_metadata_extraction.outputs.should_push == 'true' && always() && !cancelled() && needs.docker_build_production.result == 'success' }}"

    outputs:
      registry_url: ${{ steps.registry_info.outputs.registry_url }}
      image_url: ${{ steps.registry_info.outputs.image_url }}
      published_tags: ${{ steps.tag_verification.outputs.published_tags }}
      image_manifest: ${{ steps.manifest_info.outputs.manifest }}

    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4

      - name: 'Login to Container Registry'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Verify Published Images'
        id: tag_verification
        run: |
          echo 'Verifying published container images'
          PUBLISHED_TAGS=""
          VERIFICATION_FAILED="false"
          
          # Parse tags from metadata output
          echo '${{ needs.docker_metadata_extraction.outputs.tags }}' | while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              echo "Verifying tag: $tag"
              if docker manifest inspect "$tag" > /dev/null 2>&1; then
                echo "✅ Tag verified: $tag"
                PUBLISHED_TAGS="${PUBLISHED_TAGS}$tag "
              else
                echo "❌ Tag verification failed: $tag"
                VERIFICATION_FAILED="true"
              fi
            fi
          done
          
          echo "published_tags=${PUBLISHED_TAGS}" >> $GITHUB_OUTPUT
          
          if [ "$VERIFICATION_FAILED" = "true" ]; then
            echo "Some tag verifications failed"
            exit 1
          fi

      - name: 'Extract Registry Information'
        id: registry_info
        run: |
          REGISTRY_URL="${{ env.REGISTRY }}"
          IMAGE_NAME="${{ env.IMAGE_NAME }}"
          IMAGE_URL="${REGISTRY_URL}/${IMAGE_NAME}"
          
          echo "registry_url=${REGISTRY_URL}" >> $GITHUB_OUTPUT
          echo "image_url=${IMAGE_URL}" >> $GITHUB_OUTPUT
          
          echo "Registry URL: ${REGISTRY_URL}"
          echo "Image URL: ${IMAGE_URL}"
          echo "Published tags: ${{ steps.tag_verification.outputs.published_tags }}"

      - name: 'Generate Image Manifest Information'
        id: manifest_info
        run: |
          echo 'Generating image manifest information'
          PRIMARY_TAG=$(echo '${{ needs.docker_metadata_extraction.outputs.tags }}' | head -n1)
          
          if docker manifest inspect "$PRIMARY_TAG" > manifest.json 2>/dev/null; then
            # Extract key manifest information
            ARCHITECTURE=$(jq -r '.manifests[0].platform.architecture // "amd64"' manifest.json)
            OS=$(jq -r '.manifests[0].platform.os // "linux"' manifest.json)
            DIGEST=$(jq -r '.manifests[0].digest // "unknown"' manifest.json)
            
            MANIFEST_INFO="{\"architecture\":\"$ARCHITECTURE\",\"os\":\"$OS\",\"digest\":\"$DIGEST\"}"
            echo "manifest=${MANIFEST_INFO}" >> $GITHUB_OUTPUT
            
            echo "Image Architecture: $ARCHITECTURE"
            echo "Operating System: $OS"
            echo "Manifest Digest: $DIGEST"
          else
            echo "manifest={}" >> $GITHUB_OUTPUT
            echo "Could not retrieve manifest information"
          fi

      - name: 'Generate Educational Documentation'
        run: |
          mkdir -p docker-documentation
          
          cat > docker-documentation/README.md << 'EOF'
          # Docker Image Documentation
          
          ## Image Information
          - **Registry**: ${{ steps.registry_info.outputs.registry_url }}
          - **Image**: ${{ steps.registry_info.outputs.image_url }}
          - **Build Date**: ${{ needs.docker_metadata_extraction.outputs.build_date || github.event.head_commit.timestamp }}
          - **Git Commit**: ${{ github.sha }}
          
          ## Published Tags
          ${{ steps.tag_verification.outputs.published_tags }}
          
          ## Usage Examples
          
          ### Pull and Run Image
          ```bash
          # Pull the latest image
          docker pull ${{ steps.registry_info.outputs.image_url }}:latest
          
          # Run the container
          docker run -p 3000:3000 ${{ steps.registry_info.outputs.image_url }}:latest
          ```
          
          ### Health Check
          ```bash
          curl http://localhost:3000/health
          curl http://localhost:3000/hello
          ```
          
          ## Security Information
          - **Security Scan**: ${{ needs.docker_security_scan.outputs.scan_result || 'Not performed' }}
          - **Vulnerabilities**: ${{ needs.docker_security_scan.outputs.vulnerability_count || '0' }}
          - **Critical Issues**: ${{ needs.docker_security_scan.outputs.critical_count || '0' }}
          
          ## Build Information
          - **Node.js Version**: 22.x LTS
          - **Express.js Version**: 5.1.0
          - **Base Image**: node:22-alpine
          - **Image Size**: ${{ needs.docker_build_production.outputs.image_size || 'Unknown' }}
          
          EOF

      - name: 'Upload Documentation Artifacts'
        uses: actions/upload-artifact@v4
        with:
          name: 'docker-documentation'
          path: 'docker-documentation/'
          retention-days: 30

  # ===========================================================================
  # JOB 6: Docker Workflow Summary and Educational Materials
  # ===========================================================================
  docker_workflow_summary:
    name: 'Docker Workflow Summary'
    runs-on: ubuntu-22.04
    needs: 
      - docker_metadata_extraction
      - docker_build_development
      - docker_build_production
      - docker_security_scan
      - docker_registry_management
    timeout-minutes: 5
    if: 'always() && !cancelled()'

    steps:
      - name: 'Generate Comprehensive Workflow Summary'
        run: |
          echo '# 🐳 Docker Build Workflow Summary' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          
          echo '## Build Results' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          
          # Development build status
          DEV_STATUS='❌'
          if [ '${{ needs.docker_build_development.result }}' = 'success' ]; then DEV_STATUS='✅'; fi
          if [ '${{ needs.docker_build_development.result }}' = 'skipped' ]; then DEV_STATUS='⏭️'; fi
          echo "- **Development Build**: $DEV_STATUS ${{ needs.docker_build_development.result }}" >> $GITHUB_STEP_SUMMARY
          
          # Production build status
          PROD_STATUS='❌'
          if [ '${{ needs.docker_build_production.result }}' = 'success' ]; then PROD_STATUS='✅'; fi
          if [ '${{ needs.docker_build_production.result }}' = 'skipped' ]; then PROD_STATUS='⏭️'; fi
          echo "- **Production Build**: $PROD_STATUS ${{ needs.docker_build_production.result }}" >> $GITHUB_STEP_SUMMARY
          
          # Security scan status
          SEC_STATUS='❌'
          if [ '${{ needs.docker_security_scan.result }}' = 'success' ]; then SEC_STATUS='✅'; fi
          if [ '${{ needs.docker_security_scan.result }}' = 'skipped' ]; then SEC_STATUS='⏭️'; fi
          echo "- **Security Scan**: $SEC_STATUS ${{ needs.docker_security_scan.result }}" >> $GITHUB_STEP_SUMMARY
          
          # Registry management status
          REG_STATUS='❌'
          if [ '${{ needs.docker_registry_management.result }}' = 'success' ]; then REG_STATUS='✅'; fi
          if [ '${{ needs.docker_registry_management.result }}' = 'skipped' ]; then REG_STATUS='⏭️'; fi
          echo "- **Registry Management**: $REG_STATUS ${{ needs.docker_registry_management.result }}" >> $GITHUB_STEP_SUMMARY
          
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '## Image Information' >> $GITHUB_STEP_SUMMARY
          echo "- **Production Image Size**: ${{ needs.docker_build_production.outputs.image_size || 'Unknown' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Security Vulnerabilities**: ${{ needs.docker_security_scan.outputs.vulnerability_count || '0' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Critical Issues**: ${{ needs.docker_security_scan.outputs.critical_count || '0' }}" >> $GITHUB_STEP_SUMMARY
          
          # Registry information
          if [ '${{ needs.docker_registry_management.result }}' = 'success' ]; then
            echo '' >> $GITHUB_STEP_SUMMARY
            echo '## Registry Information' >> $GITHUB_STEP_SUMMARY
            echo "- **Registry**: ${{ needs.docker_registry_management.outputs.registry_url }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Image URL**: ${{ needs.docker_registry_management.outputs.image_url }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Published Tags**: ${{ needs.docker_registry_management.outputs.published_tags }}" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '## 📚 Educational Resources' >> $GITHUB_STEP_SUMMARY
          echo 'This workflow demonstrates:' >> $GITHUB_STEP_SUMMARY
          echo '- Multi-stage Docker builds with development and production targets' >> $GITHUB_STEP_SUMMARY
          echo '- Container security scanning with Trivy vulnerability assessment' >> $GITHUB_STEP_SUMMARY
          echo '- Multi-platform Docker builds for AMD64 and ARM64 architectures' >> $GITHUB_STEP_SUMMARY
          echo '- GitHub Container Registry integration with automated publishing' >> $GITHUB_STEP_SUMMARY
          echo '- Docker BuildKit optimization with layer caching and build acceleration' >> $GITHUB_STEP_SUMMARY
          echo '- Security gate enforcement with vulnerability threshold validation' >> $GITHUB_STEP_SUMMARY
          
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '## Usage Instructions' >> $GITHUB_STEP_SUMMARY
          if [ '${{ needs.docker_registry_management.result }}' = 'success' ]; then
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            echo '# Pull and run the latest image' >> $GITHUB_STEP_SUMMARY
            echo 'docker pull ${{ needs.docker_registry_management.outputs.image_url }}:latest' >> $GITHUB_STEP_SUMMARY
            echo 'docker run -p 3000:3000 ${{ needs.docker_registry_management.outputs.image_url }}:latest' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo 'Images are available locally or as workflow artifacts.' >> $GITHUB_STEP_SUMMARY
          fi