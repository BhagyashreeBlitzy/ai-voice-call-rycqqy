# CodeQL Analysis Workflow for Node.js Tutorial Backend
# This workflow performs static application security testing (SAST) using GitHub's CodeQL engine
# to detect vulnerabilities, code quality issues, and security risks in the Node.js/Express codebase.
# 
# Educational Purpose: Demonstrates integration of security scanning into modern CI/CD pipelines
# for Node.js applications, showing best practices for automated security analysis.
#
# Security Features:
# - ReDoS attack detection through Express 5.1.0 and path-to-regexp 8.x analysis
# - Dependency vulnerability scanning integration
# - Code quality and security pattern detection
# - Educational security reporting for learning purposes

name: "CodeQL Security Analysis"

on:
  # Trigger on push events to main and development branches
  push:
    branches: 
      - main
      - develop
      - 'feature/**'
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  
  # Trigger on pull request events targeting main and development branches
  pull_request:
    branches: 
      - main
      - develop
      - 'feature/**'
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  
  # Schedule weekly analysis on Sunday at midnight UTC for proactive security monitoring
  schedule:
    - cron: '0 0 * * 0'
  
  # Allow manual triggering for on-demand security analysis
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Node.js version to analyze (18.x or 22.x)'
        required: false
        default: '22.x'
        type: choice
        options:
          - '18.x'
          - '22.x'
      analysis_level:
        description: 'Analysis depth level'
        required: false
        default: 'standard'
        type: choice
        options:
          - 'standard'
          - 'extended'

# Define environment variables for consistent configuration
env:
  # Set Node.js environment for proper analysis context
  NODE_ENV: development
  # Enable CI mode for optimal performance and logging
  CI: true
  # Configure npm for CI environment
  NPM_CONFIG_PROGRESS: false
  NPM_CONFIG_AUDIT: true
  # Set CodeQL configuration
  CODEQL_EXTRACTOR_JAVASCRIPT_OPTION_TYPESCRIPT: true

# Define job permissions for security compliance
permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

# Define CodeQL analysis job with matrix strategy for Node.js versions
jobs:
  # Primary CodeQL security analysis job
  codeql-analysis:
    name: "CodeQL Analysis (Node.js ${{ matrix.node-version }})"
    runs-on: ubuntu-latest
    
    # Define matrix strategy for Node.js LTS versions as per technical specifications
    strategy:
      fail-fast: false
      matrix:
        node-version: 
          - '18.x'  # Minimum required version for Express 5.1.0
          - '22.x'  # Current LTS version with Active LTS support
        include:
          - node-version: '18.x'
            node-display: 'Node.js 18 LTS'
            coverage-upload: false
          - node-version: '22.x'
            node-display: 'Node.js 22 LTS (Active)'
            coverage-upload: true
    
    # Define execution timeout for security analysis
    timeout-minutes: 30
    
    steps:
      # Step 1: Checkout repository code with full history for comprehensive analysis
      - name: "Checkout Repository"
        uses: actions/checkout@v4  # actions/checkout v4
        with:
          # Fetch full history for comprehensive security analysis
          fetch-depth: 0
          # Include submodules if present
          submodules: recursive
          # Ensure we have access to all security-relevant files
          token: ${{ secrets.GITHUB_TOKEN }}
      
      # Step 2: Setup Node.js environment with matrix-based version selection
      - name: "Setup Node.js Environment"
        uses: actions/setup-node@v4  # actions/setup-node v4
        with:
          node-version: ${{ matrix.node-version }}
          # Use npm caching for improved performance
          cache: 'npm'
          cache-dependency-path: 'src/backend/package-lock.json'
          # Ensure compatibility with package.json engines field
          check-latest: true
      
      # Step 3: Display Node.js and npm versions for debugging and educational purposes
      - name: "Display Environment Information"
        run: |
          echo "🔍 Security Analysis Environment Information"
          echo "Node.js Version: $(node --version)"
          echo "NPM Version: $(npm --version)"
          echo "Operating System: $(uname -a)"
          echo "Matrix Configuration: ${{ matrix.node-display }}"
          echo "Analysis Trigger: ${{ github.event_name }}"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Working Directory: $(pwd)"
          echo "Available Memory: $(free -h)"
          echo "Available Disk Space: $(df -h)"
      
      # Step 4: Install dependencies with security audit
      - name: "Install Dependencies & Security Audit"
        working-directory: ./src/backend
        run: |
          echo "📦 Installing dependencies and performing security audit..."
          
          # Install dependencies with npm ci for reproducible builds
          npm ci --audit --fund=false
          
          # Display installed package versions for security analysis context
          echo "📋 Key Package Versions:"
          npm list express body-parser dotenv --depth=0
          
          # Perform comprehensive security audit
          echo "🔒 Running security audit..."
          npm audit --audit-level=high
          
          # Display dependency tree for security analysis
          echo "🌳 Dependency Analysis:"
          npm ls --depth=1 --prod
          
          # Check for known vulnerabilities in dependencies
          echo "⚠️  Checking for critical vulnerabilities..."
          npm audit --audit-level=critical || echo "Critical vulnerabilities detected - will be analyzed by CodeQL"
      
      # Step 5: Initialize CodeQL analysis with JavaScript/TypeScript language support
      - name: "Initialize CodeQL Analysis"
        uses: github/codeql-action/init@v3  # github/codeql-action/init v3
        with:
          # Specify JavaScript as the primary language for analysis
          languages: javascript
          # Use default CodeQL query suites for comprehensive analysis
          queries: security-extended,security-and-quality
          # Configure CodeQL for Node.js/Express application analysis
          config: |
            name: "Node.js Express Security Analysis"
            queries:
              - uses: security-extended
              - uses: security-and-quality
            paths:
              - src/backend
            paths-ignore:
              - node_modules
              - coverage
              - dist
              - build
              - tests
            extractor:
              javascript:
                typescript: true
                jsx: false
                index_files: true
          # Enable debug mode for educational purposes
          debug: ${{ runner.debug }}
          # Set CodeQL database location
          db-location: '${{ github.workspace }}/codeql-db'
      
      # Step 6: Build the application for CodeQL analysis
      - name: "Build Application for Analysis"
        working-directory: ./src/backend
        run: |
          echo "🏗️  Building application for CodeQL analysis..."
          
          # Run lint to ensure code quality before analysis
          echo "🔍 Running linting analysis..."
          npm run lint
          
          # Run code formatting check
          echo "🎨 Checking code formatting..."
          npm run format -- --check
          
          # Run tests to ensure functionality before security analysis
          echo "🧪 Running test suite..."
          npm run test
          
          # Prepare application for analysis (using npm prepare script)
          echo "🔧 Preparing application..."
          npm run prepare
          
          # Create analysis report directory
          mkdir -p analysis-reports
          
          # Generate dependency report for security analysis
          echo "📊 Generating dependency analysis report..."
          npm list --json --prod > analysis-reports/dependencies.json
          
          # Generate security audit report
          echo "🔒 Generating security audit report..."
          npm audit --json > analysis-reports/security-audit.json || true
          
          # Display analysis preparation summary
          echo "✅ Application prepared for CodeQL analysis"
          echo "📁 Analysis artifacts created in analysis-reports/"
      
      # Step 7: Perform CodeQL analysis with autobuild
      - name: "Perform CodeQL Analysis"
        uses: github/codeql-action/analyze@v3  # github/codeql-action/analyze v3
        with:
          # Specify analysis category for tracking
          category: "/language:javascript"
          # Upload results to GitHub Security tab
          upload: true
          # Add analysis output path
          output: codeql-analysis-results
          # Set analysis timeout
          ram: 4096
          # Enable verbose logging for educational purposes
          debug: ${{ runner.debug }}
      
      # Step 8: Upload analysis artifacts for review and educational purposes
      - name: "Upload Analysis Artifacts"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "codeql-analysis-artifacts-node${{ matrix.node-version }}"
          path: |
            src/backend/analysis-reports/
            codeql-analysis-results/
            coverage/
          retention-days: 30
          if-no-files-found: warn
      
      # Step 9: Generate security analysis summary for educational purposes
      - name: "Generate Security Analysis Summary"
        if: always()
        run: |
          echo "📋 CodeQL Security Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "=================================" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Analysis Configuration:**" >> $GITHUB_STEP_SUMMARY
          echo "- Node.js Version: ${{ matrix.node-display }}" >> $GITHUB_STEP_SUMMARY
          echo "- Express Version: 5.1.0" >> $GITHUB_STEP_SUMMARY
          echo "- Analysis Queries: security-extended, security-and-quality" >> $GITHUB_STEP_SUMMARY
          echo "- Language: JavaScript/TypeScript" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Security Features Analyzed:**" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ ReDoS attack patterns (via path-to-regexp 8.x)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Express 5.1.0 security enhancements" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Dependency vulnerability scanning" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Code quality and security patterns" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Promise rejection handling analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Analysis Results:**" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 Results uploaded to GitHub Security tab" >> $GITHUB_STEP_SUMMARY
          echo "- 📁 Analysis artifacts available for download" >> $GITHUB_STEP_SUMMARY
          echo "- 🔍 Detailed findings available in Security > Code scanning alerts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Educational Notes:**" >> $GITHUB_STEP_SUMMARY
          echo "This analysis demonstrates best practices for integrating static application security testing (SAST) into Node.js/Express CI pipelines. The workflow covers:" >> $GITHUB_STEP_SUMMARY
          echo "- Automated security scanning on code changes" >> $GITHUB_STEP_SUMMARY
          echo "- Multi-version Node.js compatibility testing" >> $GITHUB_STEP_SUMMARY
          echo "- Comprehensive dependency security analysis" >> $GITHUB_STEP_SUMMARY
          echo "- Integration with GitHub Security features" >> $GITHUB_STEP_SUMMARY
          echo "- Extensible configuration for custom security rules" >> $GITHUB_STEP_SUMMARY
      
      # Step 10: Comment on pull request with analysis summary (for educational purposes)
      - name: "Comment on Pull Request"
        if: github.event_name == 'pull_request' && matrix.node-version == '22.x'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `
            ## 🔒 CodeQL Security Analysis Complete
            
            **Analysis Summary:**
            - ✅ Static application security testing (SAST) completed
            - 🔍 Scanned for security vulnerabilities and code quality issues
            - 📊 Results available in [Security tab](https://github.com/${{ github.repository }}/security/code-scanning)
            
            **Key Security Features Analyzed:**
            - ReDoS attack patterns (Express 5.1.0 + path-to-regexp 8.x)
            - Dependency vulnerabilities
            - Code quality and security patterns
            - Promise rejection handling
            
            **Node.js Compatibility:**
            - Node.js 18.x LTS: Analyzed ✅
            - Node.js 22.x LTS: Analyzed ✅
            
            **Educational Notes:**
            This workflow demonstrates best practices for integrating security scanning into modern Node.js/Express development workflows. The analysis helps identify potential security issues early in the development cycle.
            
            ---
            *This comment is generated automatically by the CodeQL Security Analysis workflow for educational purposes.*
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # Secondary job for advanced security analysis (educational enhancement)
  security-report:
    name: "Security Analysis Report"
    runs-on: ubuntu-latest
    needs: codeql-analysis
    if: always()
    
    steps:
      # Generate comprehensive security report
      - name: "Generate Security Report"
        run: |
          echo "📋 Comprehensive Security Analysis Report"
          echo "========================================"
          echo ""
          echo "**Workflow Configuration:**"
          echo "- Trigger: ${{ github.event_name }}"
          echo "- Repository: ${{ github.repository }}"
          echo "- Branch: ${{ github.ref_name }}"
          echo "- Commit: ${{ github.sha }}"
          echo ""
          echo "**Analysis Matrix Results:**"
          echo "- Node.js 18.x LTS: ${{ needs.codeql-analysis.result }}"
          echo "- Node.js 22.x LTS: ${{ needs.codeql-analysis.result }}"
          echo ""
          echo "**Security Framework Integration:**"
          echo "- CodeQL SAST: ✅ Enabled"
          echo "- Dependency Scanning: ✅ Enabled"
          echo "- Express 5.1.0 Security: ✅ Enabled"
          echo "- ReDoS Protection: ✅ Enabled"
          echo "- Security Headers: ✅ Configured"
          echo ""
          echo "**Educational Value:**"
          echo "This workflow demonstrates:"
          echo "- Integration of security scanning in CI/CD pipelines"
          echo "- Multi-version compatibility testing"
          echo "- Automated vulnerability detection"
          echo "- Best practices for Node.js security"
          echo "- GitHub Security features utilization"
          echo ""
          echo "**Next Steps:**"
          echo "1. Review CodeQL results in Security tab"
          echo "2. Address any identified vulnerabilities"
          echo "3. Monitor security alerts regularly"
          echo "4. Keep dependencies updated"
          echo "5. Extend analysis with custom CodeQL queries"
          echo ""
          echo "✅ Security analysis workflow completed successfully!"